# Local build entry point. Production and discovery use compose.release.yaml.
services:
  sharepoint-site-control:
    extends:
      file: compose.release.yaml
      service: sharepoint-site-control
    build:
      context: ../..
      dockerfile: infrastructure/sharepoint-site-control/Dockerfile
      args:
        JASON_RUNTIME_BASE_IMAGE: ${JASON_SHAREPOINT_RUNTIME_BASE_DIGEST:?immutable approved runtime image digest required}

networks:
  observability:
    external: true
    name: jason-observability
  jason-core:
    external: true
    name: jason-core

volumes:
  sharepoint-site-state:
    external: true
    name: jason-sharepoint-site-state
