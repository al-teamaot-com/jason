services:
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: jason-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: jason-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - observability

  ollama:
    image: ollama/ollama:0.32.5
    container_name: jason-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - observability

  autonomy-flight-recorder:
    image: python:3.12-slim
    container_name: jason-autonomy-flight-recorder
    restart: unless-stopped
    command: ["python3", "/app/autonomy_flight_recorder_exporter.py"]
    environment:
      JASON_AUTONOMY_FLIGHT_RECORDER_HOST: "0.0.0.0"
      JASON_AUTONOMY_FLIGHT_RECORDER_PORT: "9475"
      JASON_ORCHESTRATION_EVENTS_DB: /var/lib/jason/openclaw/orchestration-events.sqlite3
      JASON_GOVERNED_EXECUTION_DB: /var/lib/jason/openclaw/governed-execution.sqlite3
      JASON_AUTHORITY_DB: /var/lib/jason/authority/authority.sqlite3
      JASON_AUTONOMY_SHADOW_DB: /var/lib/jason/openclaw/autonomy-shadow.sqlite3
    volumes:
      - ./autonomy_flight_recorder_exporter.py:/app/autonomy_flight_recorder_exporter.py:ro
      - /var/lib/jason/openclaw:/var/lib/jason/openclaw:ro
      - /var/lib/jason/authority:/var/lib/jason/authority:ro
    ports:
      - "127.0.0.1:9475:9475"
    networks:
      - observability

  grafana:
    image: grafana/grafana:12.2.1
    container_name: jason-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability
      - jason-core

networks:
  observability:
    name: jason-observability
  jason-core:
    external: true
    name: jason-core

volumes:
  prometheus-data:
  grafana-data:
  ollama-data:
