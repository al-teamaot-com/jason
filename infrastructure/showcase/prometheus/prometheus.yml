global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: jason-host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: jason-status
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-status.json
        refresh_interval: 30s
