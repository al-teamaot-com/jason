global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: jason-host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: jason-status
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-status.json
        refresh_interval: 30s

  - job_name: jason-production-health
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-production-health.json
        refresh_interval: 30s

  - job_name: jason-usage
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-usage.json
        refresh_interval: 30s

  - job_name: jason-usage-attribution
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-usage-attribution.json
        refresh_interval: 30s

  - job_name: jason-playbooks
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-playbooks.json
        refresh_interval: 30s

  - job_name: jason-resolution-memory
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-resolution-memory.json
        refresh_interval: 30s
  - job_name: jason-ai-prompts
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-ai-prompts.json
        refresh_interval: 30s
  - job_name: jason-component-engineering
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-component-engineering.json
        refresh_interval: 30s
  - job_name: jason-communication-templates
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/jason-communication-templates.json
        refresh_interval: 30s
