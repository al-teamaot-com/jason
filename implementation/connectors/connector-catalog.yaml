schema_version: "0.1"
principles:
  - connectors_do_not_require_ai
  - agents_never_call_connectors_directly
  - capabilities_are_named_and_registered
  - credentials_are_resolved_by_logical_secret_name
  - all_calls_are_client_scoped_authorized_and_audited
connectors:
  openclaw:
    status: foundation_built
    priority: 1
    next:
      - production_transport
      - signed_requests_or_mtls
      - identity_mapping
      - health_and_capability_discovery
  autotask:
    status: foundation_built
    priority: 2
    mode: read_only
    secret: autotask.readonly
    capabilities:
      - autotask.entity.describe
      - autotask.entity.get
      - autotask.entity.query
      - autotask.ticket.get
      - autotask.ticket.search
      - autotask.ticket.notes.list
      - autotask.company.get
      - autotask.contact.get
      - autotask.configuration_item.get
  datto_rmm:
    status: foundation_built
    priority: 3
    mode: read_only
    secret: datto_rmm.readonly
    capabilities:
      - datto_rmm.device.get
      - datto_rmm.device.search
      - datto_rmm.alerts.list
      - datto_rmm.patch_status.get
      - datto_rmm.component_results.list
    canonical_mappings:
      endpoint.device.search: datto_rmm.device.search
      endpoint.device.read: datto_rmm.device.get
      endpoint.device.audit.read: datto_rmm.patch_status.get
    notes:
      - Provider-neutral endpoint capabilities are selected by Jason governance before connector invocation.
      - Datto RMM remains an implementation provider and is never selected directly by Teams, OpenClaw, or an agent.
      - Interactive Windows session identity is not yet declared as a Datto RMM capability because the existing connector does not expose a verified session endpoint.
  datto_edr:
    status: foundation_built
    priority: 4
    mode: read_only
    secret: datto_edr.readonly
    capabilities:
      - datto_edr.endpoint.status.read
      - datto_edr.alert.search
      - datto_edr.alert.read
      - datto_edr.policy.search
      - datto_edr.scan_history.search
      - datto_edr.quarantine.search
    canonical_mappings:
      endpoint.security.status.read: datto_edr.endpoint.status.read
      endpoint.security.detection.search: datto_edr.alert.search
      endpoint.security.detection.read: datto_edr.alert.read
      endpoint.security.policy.read: datto_edr.policy.search
      endpoint.security.scan.history.search: datto_edr.scan_history.search
      endpoint.security.quarantine.search: datto_edr.quarantine.search
    notes:
      - Endpoint identity is correlated from the durable Datto RMM device UID to Datto EDR deviceId.
      - Hostname alone is never used to select among duplicate EDR agent records.
      - Detection and quarantine evidence never imply endpoint compromise without explicit supporting evidence.
      - Provider mutation routes such as scan, quarantine, isolation, archive, and response remain unregistered.

  it_glue:
    status: foundation_built
    priority: 4
    mode: read_only
    secret: it_glue.readonly
    capabilities:
      - it_glue.entity.get
      - it_glue.entity.query
      - it_glue.organization.get
      - it_glue.configuration.search
      - it_glue.flexible_asset.search
      - it_glue.document.get
      - it_glue.relationships.list
  n8n:
    status: foundation_built
    priority: 5
    mode: approved_workflows_only
    secret: n8n.runtime
    capabilities:
      - n8n.workflow.invoke
      - n8n.workflow.status
      - n8n.execution.get
  postgres:
    status: partial
    priority: 6
  microsoft_graph:
    status: platform_foundation_built
    priority: 7
    mode: governed_read_first
    service_families:
      - graph
      - entra
      - exchange_online
      - sharepoint_online
      - onedrive
      - teams
      - intune
      - defender
      - purview
      - service_health
      - licensing
    permission_profiles:
      - directory-read
      - identity-investigation-read
      - mail-investigation-read
      - device-compliance-read
      - security-investigation-read
      - collaboration-permissions-read
    next:
      - openbao_certificate_credential_source
      - multitenant_app_registration
      - persistent_client_boundary_registry
      - live_token_validation
      - first_graph_read_capability
      - controlled_test_tenant_onboarding
      - production_validation
  aws:
    status: platform_foundation_built
    priority: 8
    mode: governed_read_first
    secret: aws.readonly.assume_role
    credential_model: sts_runtime_only
    service_families:
      - sts
      - organizations
      - iam
      - config
      - securityhub
      - guardduty
      - cloudtrail
      - ec2
      - s3
      - rds
      - backup
      - ssm
    next:
      - openbao_role_binding
      - controlled_test_account
      - sts_get_caller_identity_validation
      - organizations_account_discovery
      - first_regional_inventory_read
      - normalized_resource_adapter
      - orchestrated_live_read_validation
  kyocera_kfs:
    status: foundation_built
    priority: 9
    mode: read_only
    secret: kyocera_kfs.readonly
    api_host: https://api.kyods.com
    capabilities:
      - kyocera_kfs.device.search
      - kyocera_kfs.device.get
      - kyocera_kfs.meters.get
      - kyocera_kfs.supplies.get
      - kyocera_kfs.alerts.list
    canonical_mappings:
      print.device.search: kyocera_kfs.device.search
      print.device.read: kyocera_kfs.device.get
      print.meter.read: kyocera_kfs.meters.get
      print.supplies.read: kyocera_kfs.supplies.get
      print.alert.search: kyocera_kfs.alerts.list
    live_enablement_gate:
      - kyocera_issued_api_credentials
      - kyocera_issued_header_contract
      - kyocera_issued_operation_paths
      - openbao_secret_provisioning
      - controlled_read_only_validation
    notes:
      - Exact provider headers and paths are configuration-driven and fail closed until the official dealer API contract is supplied.
      - No KFS remote-management, firmware, configuration, or other write capability is enabled.
  backup_net:
    status: foundation_built_credentials_pending
    priority: 10
    mode: read_only
    secret: backup_net.readonly
    api_host: https://public-api.backup.net
    auth_host: https://login.backup.net
    capabilities:
      - backup_net.endpoint_asset.search
      - backup_net.endpoint_asset.read
      - backup_net.backup.search
      - backup_net.backupiq_alert.search
    canonical_mappings:
      backup.endpoint.asset.search: backup_net.endpoint_asset.search
      backup.endpoint.asset.read: backup_net.endpoint_asset.read
      backup.endpoint.backup.search: backup_net.backup.search
      backup.backupiq.alert.search: backup_net.backupiq_alert.search
    live_enablement_gate:
      - uniview_public_api_client_id_and_secret
      - openbao_secret_provisioning
      - validated_autotask_company_to_backup_net_customer_boundary
      - controlled_read_only_acceptance
    notes:
      - Provider customer_id is derived only from a validated Jason boundary and may not be supplied by callers.
      - Every returned asset, backup, or alert must prove the same customer UUID or the read fails closed.
      - No Backup.net write or remediation capability is registered.
  dnsfilter:
    status: foundation_built_credentials_pending
    priority: 11
    mode: read_only
    secret: dnsfilter.readonly
    api_host: https://api.dnsfilter.com
    capabilities:
      - dnsfilter.organization.read
      - dnsfilter.network.search
      - dnsfilter.policy.search
      - dnsfilter.user_agent.search
      - dnsfilter.user_agent.counts
    canonical_mappings:
      dns.protection.organization.read: dnsfilter.organization.read
      dns.protection.site.search: dnsfilter.network.search
      dns.protection.policy.search: dnsfilter.policy.search
      dns.protection.agent.search: dnsfilter.user_agent.search
      dns.protection.agent.counts.read: dnsfilter.user_agent.counts
    live_enablement_gate:
      - dnsfilter_api_key
      - openbao_secret_provisioning
      - validated_autotask_company_to_dnsfilter_organization_boundary
      - controlled_read_only_acceptance
    notes:
      - Caller-supplied DNSFilter organization and MSP identifiers are rejected; organization scope is derived from the validated client boundary.
      - Network and policy reads must prove the mapped organization relationship where the provider response exposes it.
      - Roaming-agent reads are organization-filtered collections; direct agent-by-ID reads remain unregistered until response scope can be independently proven.
      - REST is the unattended posture/evidence plane; no DNSFilter REST mutation capability is registered.
  dnsfilter_mcp:
    status: foundation_built_oauth_pending
    priority: 11
    mode: governed_read_first
    mcp_url: https://mcp.dnsfilter.com/mcp
    oauth_store: /var/lib/jason/openclaw/dnsfilter-mcp/oauth.sqlite3
    capabilities:
      - dnsfilter_mcp.query_logs.search
      - dnsfilter_mcp.query_decision.explain
      - dnsfilter_mcp.blocked_traffic.search
      - dnsfilter_mcp.traffic_anomalies.search
      - dnsfilter_mcp.stale_agents.search
      - dnsfilter_mcp.agent_version.report
      - dnsfilter_mcp.duplicate_agents.search
      - dnsfilter_mcp.site_policy_drift.search
      - dnsfilter_mcp.policy_category.search
      - dnsfilter_mcp.unblock_requests.search
      - dnsfilter_mcp.unblock_requests.count
    canonical_mappings:
      dns.investigation.query.search: dnsfilter_mcp.query_logs.search
      dns.investigation.query.explain: dnsfilter_mcp.query_decision.explain
      dns.investigation.blocked.traffic.search: dnsfilter_mcp.blocked_traffic.search
      dns.investigation.anomaly.search: dnsfilter_mcp.traffic_anomalies.search
      dns.protection.agent.stale.search: dnsfilter_mcp.stale_agents.search
      dns.protection.agent.version.report: dnsfilter_mcp.agent_version.report
      dns.protection.agent.duplicate.search: dnsfilter_mcp.duplicate_agents.search
      dns.protection.site.drift.search: dnsfilter_mcp.site_policy_drift.search
      dns.protection.policy.category.search: dnsfilter_mcp.policy_category.search
      dns.protection.unblock.request.search: dnsfilter_mcp.unblock_requests.search
      dns.protection.unblock.request.count.read: dnsfilter_mcp.unblock_requests.count
    live_enablement_gate:
      - dnsfilter_user_oauth
      - validated_autotask_company_to_dnsfilter_organization_boundary
      - explicit_read_authority
      - controlled_read_only_acceptance
    notes:
      - DNSFilter documents per-user OAuth, periodic re-authentication, privacy enforcement, and a confirmation gate on every write.
      - Jason injects the validated DNSFilter organization ID into each supported MCP read and rejects caller-supplied organization/MSP scope.
      - The provider's public tool catalog is snapshotted under docs/reference for drift review.
      - All 25 currently confirm-gated provider writes are represented only as dormant BUILDING capability definitions; none is registered for runtime execution.

  teams_approvals:
    status: planned
    priority: 10
  opentelemetry:
    status: planned
    priority: 11
  object_storage:
    status: planned
    priority: 12
