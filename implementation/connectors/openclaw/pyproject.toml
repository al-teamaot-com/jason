[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jason-openclaw-connector"
version = "0.1.0"
description = "Provider-neutral OpenClaw ingress connector for Project Jason"
requires-python = ">=3.12"
dependencies = ["cryptography>=45,<47"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
