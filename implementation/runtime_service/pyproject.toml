[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jason-runtime-service"
version = "0.1.0"
description = "Internal Project Jason governed runtime HTTP boundary"
requires-python = ">=3.12"
dependencies = [
  "jason-connectors==0.1.0",
  "jason-openclaw-connector==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "../",
  "../connectors/openclaw/src",
]
testpaths = ["tests"]
addopts = "-q"
