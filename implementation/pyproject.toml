[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jason-connectors"
version = "0.1.0"
description = "Project Jason shared connector runtime and providers"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "jsonschema>=4.23,<5",
  "msal>=1.35,<2",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["connectors*", "kernel*", "management_api*"]

[tool.pytest.ini_options]
pythonpath = [".", "connectors", "connectors/src"]
testpaths = ["connectors/tests"]
addopts = "-q"
