[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jason-connectors"
version = "0.1.0"
description = "Project Jason shared connector runtime and providers"
requires-python = ">=3.12"
dependencies = [
  "msal>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["connectors*", "kernel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["connectors/tests"]
addopts = "-q"
