[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jason-mcp-service"
version = "0.1.0"
description = "Read-only MCP interface adapter for Project Jason"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "starlette>=0.40,<1",
  "uvicorn>=0.30,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2,<3",
]

[project.scripts]
jason-mcp = "jason_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
