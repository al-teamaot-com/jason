version: 1

autonomous_queue:
  max_active_work_items: 2
  attention_mode: event_first
  staleness_watchdog_enabled: true
  candidate_investigation_mode: read_only
  claim_requires_matched_autonomous_playbook: true

governance:
  hierarchy:
    - global
    - site
    - device
    - user
    - ticket
  evidence_can_create_authority: false
  exact_ticket_action_grant_binding_required: true
  grants_may_override_block: false
  revalidate_before_mutation: true

default_outcome: block

requirements:
  client_scope_required: true
  device_identity_required: true
  idempotency_key_required: true
  execution_timeout_required: true
  verification_required: true
  rollback_or_escalation_required: true
  maintenance_window_enforced: true
  provider_success_requires_independent_verification: true

pilot:
  maximum_autonomy: approved_execute
  automatic_ticket_close: false
  client_confirmation_required_for_user_visible_symptoms: true

rules:
  - id: jason-datto-edr-av-standing-safe
    description: Permit bounded standing-safe steps inside Jason - Datto EDR/AV Diagnose & Repair for one exact workstation target.
    playbook: Jason - Datto EDR/AV Diagnose & Repair
    playbook_version: 1.2.0
    maximum_targets: 1
    outcome: allow
    autonomy_level: low_risk_autonomous
    allowed_operations:
      - Check Datto EDR/AV Status AOT Ver 12122025-1
      - Check Service Detail & Diagnostic [WIN] AOT Ver 12122025-1
      - Datto EDR Maintenance [WIN]
      - Datto EDR Force Reinstall and Upgrade [WIN] AOT 09162024
    conditions:
      exact_device_identity_required: true
      exact_client_scope_required: true
      device_role: workstation
      playbook_state_machine_required: true
      per_step_attempt_limit: 1
      duplicate_dispatch_prohibited: true
      direct_provider_access: false
      scheduled_reboot_requires_approval: true
      scheduled_reboot_local_time: "02:30"
      scheduled_verify_local_time: "03:30"
      immediate_reboot_allowed: false
      internal_ticket_notes_only: true
    verification:
      capability: Check Datto EDR/AV Status AOT Ver 12122025-1
      success_expression: Status=Healthy
    on_failure:
      action: continue_bounded_playbook_or_escalate
      redispatch_on_read_failure: false

  - id: jason-datto-edr-av-force-update-binding
    description: Datto AV force-update must use an exact vetted component or dedicated governed capability before this step may execute autonomously.
    playbook: Jason - Datto EDR/AV Diagnose & Repair
    operation: agent.exe datto-av --force-update
    outcome: block
    autonomy_level: prohibited
    until:
      exact_governed_capability_registered: true
      arbitrary_shell_fallback_prohibited: true

  - id: jason-datto-edr-av-clean-recovery-pilot
    description: Keep the clean EDR/AV uninstall and recovery branch approval-gated during supervised pilot validation.
    playbook: Jason - Datto EDR/AV Diagnose & Repair
    playbook_version: 1.2.0
    operations:
      - Uninstall Datto EDR / AV AOT Ver 11052025-1
      - recovery scheduled reboot
      - recovery Datto EDR Maintenance [WIN]
      - recovery Datto EDR Force Reinstall and Upgrade [WIN] AOT 09162024
      - recovery Datto AV force-update governed capability
    maximum_targets: 1
    outcome: require_approval
    autonomy_level: approved_execute
    required_approver_roles:
      - technician
    conditions:
      ordinary_repair_ladder_exhausted: true
      exact_device_identity_required: true
      exact_client_scope_required: true
      maintenance_window_required: true
      direct_provider_access: false
    verification:
      capability: Check Datto EDR/AV Status AOT Ver 12122025-1
      success_expression: Status=Healthy
    on_failure:
      action: escalate
      internal_note_only: true

  - id: approved-quickbooks-update-workstation
    description: Permit a technician-approved QuickBooks update on a single workstation.
    capability: drmm.software.quickbooks.update
    device_role: workstation
    maximum_targets: 1
    outcome: require_approval
    autonomy_level: approved_execute
    required_approver_roles:
      - technician
    conditions:
      authoritative_vendor_evidence: true
      installed_version_confirmed: true
      approved_component_only: true
      active_user_warning_required: true
      company_file_backup_state_known: true
    verification:
      capability: drmm.software.quickbooks.verify
      checks:
        - installed_version
        - relevant_services_running
        - update_exit_code
    on_failure:
      action: escalate
      create_high_priority_internal_note: true

  - id: block-server-software-update-pilot
    description: Block autonomous line-of-business application updates on servers during the pilot.
    capability_pattern: drmm.software.*.update
    device_role: server
    outcome: block
    autonomy_level: prohibited

promotion:
  self_approval_allowed: false
  minimum_successful_executions: 25
  minimum_observation_days: 30
  minimum_verified_success_rate: 0.98
  maximum_rollback_rate: 0.01
  maximum_unplanned_intervention_rate: 0.02
  required_approver_roles:
    - technology_steward
    - service_manager
  review_interval_days: 90
  retirement_criteria_required: true
