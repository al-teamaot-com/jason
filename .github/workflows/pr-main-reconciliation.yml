name: Reconcile Jason PRs With Main

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - edited
      - synchronize

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: jason-pr-main-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify reconciler unit contract
        run: python3 -B -m unittest tools.tests.test_pr_branch_reconciler

      - name: Reconcile eligible PRs and merge only after green validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/pr_branch_reconciler.py
          --repository "$GITHUB_REPOSITORY"
