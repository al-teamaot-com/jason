name: Validate Kyocera KFS Read-Only Foundation

on:
  pull_request:
    paths:
      - 'implementation/connectors/kyocera_kfs/**'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/connectors/connector-catalog.yaml'
      - 'implementation/connectors/tests/test_kyocera_kfs_connector.py'
      - 'implementation/orchestrator/print_capability_catalog.py'
      - 'implementation/orchestrator/tests/test_print_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - 'tools/provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - '.github/workflows/kyocera-kfs-foundation.yml'
  push:
    paths:
      - 'implementation/connectors/kyocera_kfs/**'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/connectors/connector-catalog.yaml'
      - 'implementation/connectors/tests/test_kyocera_kfs_connector.py'
      - 'implementation/orchestrator/print_capability_catalog.py'
      - 'implementation/orchestrator/tests/test_print_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - 'tools/provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - '.github/workflows/kyocera-kfs-foundation.yml'

jobs:
  validate-kfs-foundation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile KFS governed read boundary
        run: |
          python -m py_compile implementation/connectors/kyocera_kfs/connector.py
          python -m py_compile implementation/orchestrator/print_capability_catalog.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/composition.py
      - name: Run KFS connector and capability tests
        run: |
          python -m pytest implementation/connectors/tests/test_kyocera_kfs_connector.py -q
          python -m pytest implementation/orchestrator/tests/test_print_capability_catalog.py -q
          python -m pytest tools/tests/test_provider_secret_provision.py -q
      - name: Verify KFS remains credential-safe and fail-closed by default
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('implementation/connectors/kyocera_kfs/connector.py').read_text()
          assert 'api.kyods.com' in source
          assert 'kyocera_kfs.readonly' in source
          assert 'GET' in source and 'POST' in source
          assert 'PUT' not in source
          assert 'PATCH' not in source
          assert 'DELETE' not in source
          composition = Path(
              'implementation/runtime_service/src/jason_runtime/composition.py'
          ).read_text()
          assert 'JASON_KFS_ENABLED' in composition
          assert 'false' in composition
          PY
