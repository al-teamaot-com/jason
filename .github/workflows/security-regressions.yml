name: SEC-007 Security Regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governed-security-regressions:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/cap-007/src:implementation/connectors/openclaw/src:implementation/runtime_service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security regression dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install ./implementation ./implementation/connectors/openclaw ./implementation/runtime_service
      - name: Compile security-critical modules and tests
        run: |
          python -m compileall -q \
            implementation/kernel \
            implementation/orchestrator \
            implementation/runtime_service/src \
            implementation/runtime_service/tests \
            implementation/mcp_service/src \
            implementation/mcp_service/tests
      - name: Cross-client and execution-plan binding regressions
        run: |
          python -m pytest -q \
            implementation/kernel/tests/test_client_boundaries.py \
            implementation/kernel/tests/test_client_boundaries_sqlite.py \
            implementation/orchestrator/tests/test_execution_plan_binding.py \
            implementation/orchestrator/tests/test_governed_execution_replay.py \
            implementation/orchestrator/tests/test_approval_continuation_guard.py \
            implementation/tests/test_approval_continuation.py \
            implementation/tests/test_approval_recovery.py \
            implementation/tests/test_approval_recovery_retry.py
      - name: Active write-provider execution-plan regressions
        run: |
          python -m pytest -q \
            implementation/runtime_service/tests/test_autotask_internal_note.py \
            implementation/runtime_service/tests/test_autotask_procurement_runtime.py \
            implementation/runtime_service/tests/test_autotask_ticket_create.py \
            implementation/runtime_service/tests/test_autotask_ticket_update.py \
            implementation/runtime_service/tests/test_datto_alert_resolution_runtime.py \
            implementation/runtime_service/tests/test_datto_component_approval_registry.py \
            implementation/runtime_service/tests/test_datto_component_execution_regression.py \
            implementation/runtime_service/tests/test_datto_component_execution_runtime.py \
            implementation/runtime_service/tests/test_datto_edr_scan_execution.py \
            implementation/runtime_service/tests/test_datto_site_variable_management.py \
            implementation/runtime_service/tests/test_dnsfilter_mcp_mutation.py \
            implementation/runtime_service/tests/test_teams_message_send_execution_plan.py \
            implementation/connectors/tests/test_autotask_mutation_connector.py \
            implementation/connectors/tests/test_autotask_procurement_mutation_connector.py
      - name: Approval and transport authority regressions
        run: |
          python -m pytest -q \
            implementation/connectors/tests/test_approval_requests.py \
            implementation/connectors/tests/test_teams_approval_delivery.py \
            implementation/connectors/tests/test_teams_approval_ingress.py \
            implementation/connectors/tests/test_openclaw_teams_approval_transport.py \
            implementation/orchestrator/tests/test_teams_approval_flow.py
