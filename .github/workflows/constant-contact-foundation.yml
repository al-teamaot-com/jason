name: Validate Constant Contact Integration Foundation

on:
  pull_request:
    paths:
      - 'implementation/connectors/constant_contact/**'
      - 'infrastructure/constant-contact-readback/**'
      - 'implementation/connectors/tests/test_constant_contact_*.py'
      - 'implementation/orchestrator/constant_contact_capability_catalog.py'
      - 'implementation/orchestrator/constant_contact_import_capability.py'
      - 'implementation/orchestrator/tests/test_constant_contact_*.py'
      - 'implementation/runtime_service/src/jason_runtime/constant_contact_*.py'
      - 'implementation/runtime_service/tests/test_constant_contact_*.py'
      - 'implementation/mcp_service/tests/test_constant_contact_*.py'
      - 'tools/constant_contact_reconcile_once.py'
      - 'implementation/mcp_service/src/jason_mcp/server.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - 'tools/constant_contact_oauth.py'
      - 'tools/provider_secret_provision.py'
      - 'tools/tests/test_constant_contact_*.py'
      - 'implementation/pyproject.toml'
      - '.github/workflows/constant-contact-foundation.yml'
  push:
    paths:
      - 'implementation/connectors/constant_contact/**'
      - 'infrastructure/constant-contact-readback/**'
      - 'implementation/connectors/tests/test_constant_contact_*.py'
      - 'implementation/orchestrator/constant_contact_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/constant_contact_*.py'
      - 'implementation/runtime_service/tests/test_constant_contact_*.py'
      - 'implementation/mcp_service/tests/test_constant_contact_*.py'
      - 'tools/constant_contact_reconcile_once.py'
      - '.github/workflows/constant-contact-foundation.yml'

permissions:
  contents: read

jobs:
  constant-contact-source:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/runtime_service/src:implementation/cap-001/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pytest>=8.3,<10' 'cryptography>=50,<51' 'openpyxl>=3.1,<4' 'mcp==2.2.0' 'PyJWT>=2.8,<3' 'requests>=2.31,<3'
      - name: Compile source and runtime integration
        run: |
          python -m compileall -q implementation/connectors/constant_contact implementation/orchestrator/constant_contact_capability_catalog.py implementation/orchestrator/constant_contact_import_capability.py implementation/runtime_service/src/jason_runtime/constant_contact_activation.py implementation/runtime_service/src/jason_runtime/constant_contact_reads.py implementation/runtime_service/src/jason_runtime/constant_contact_reconcile_entrypoint.py implementation/runtime_service/src/jason_runtime/constant_contact_import_runtime.py implementation/runtime_service/src/jason_runtime/constant_contact_import_workflow.py implementation/runtime_service/src/jason_runtime/constant_contact_teams_approval.py implementation/runtime_service/src/jason_runtime/composition.py implementation/mcp_service/src/jason_mcp/server.py tools/constant_contact_oauth.py tools/constant_contact_reconcile_once.py
      - name: Run Constant Contact regression tests
        run: |
          python -m pytest -q implementation/connectors/tests/test_constant_contact_*.py implementation/runtime_service/tests/test_constant_contact_*.py implementation/orchestrator/tests/test_constant_contact_*.py tools/tests/test_constant_contact_secret_provision.py
      - name: Verify authenticated MCP file handoff contract
        run: |
          PYTHONPATH="implementation:$(find implementation -maxdepth 3 -type d -name src -print | paste -sd: -)" python -m pytest -q implementation/mcp_service/tests/test_constant_contact_mcp_handoff.py implementation/mcp_service/tests/test_procurement_mcp_handoff.py
      - name: Verify reconciler remains dormant
        run: |
          python tools/constant_contact_reconcile_once.py --check-only
      - name: Verify source-only defaults
        run: |
          test -z "${JASON_CONSTANT_CONTACT_READ_PROFILE:-}"
          test -z "${JASON_CONSTANT_CONTACT_IMPORT_PROFILE:-}"
          test -z "${JASON_CONSTANT_CONTACT_RECONCILE_PROFILE:-}"
