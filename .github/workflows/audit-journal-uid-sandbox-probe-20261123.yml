name: Disposable audit journal systemd identity probe (branch only)

on:
  push:
    branches:
      - fix/audit-journal-uid-handoff-20261123

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Reproduce UID handoff within the same NNP and capability boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/jason-audit-writer-systemd-probe.py <<'PY'
          import json, os, subprocess
          from pathlib import Path
          text=dict(line.split(":",1) for line in Path("/proc/self/status").read_text().splitlines() if ":" in line)
          print("PROBE_PARENT",json.dumps({k:text.get(k,"").strip() for k in ("Uid","Gid","Groups","CapPrm","CapEff","CapBnd","CapAmb","NoNewPrivs")}),flush=True)
          trials=(
           ("plain",{}),
           ("new_session",{"start_new_session":True}),
           ("empty_groups",{"extra_groups":()}),
           ("change_gid",{"group":1000}),
           ("change_uid",{"user":1000}),
           ("full",{"user":1000,"group":1000,"extra_groups":(),"start_new_session":True})
          )
          for label,kw in trials:
           try:
            result=subprocess.run(["/usr/bin/true"],timeout=4,check=False,capture_output=True,**kw)
            print("PROBE_TRIAL",label,"returncode",result.returncode,flush=True)
           except OSError as e:
            print("PROBE_TRIAL",label,"exception",e.__class__.__name__,"errno",e.errno,flush=True)
          PY
          chmod 444 /tmp/jason-audit-writer-systemd-probe.py
          echo "TEST_NO_AMBIENT_START"
          timeout 50s sudo systemd-run --wait --collect --pipe \
            --unit="audit-uid-boundary-ci-noambient-$GITHUB_RUN_ID" \
            --property="User=root" \
            --property="Group=root" \
            --property="NoNewPrivileges=yes" \
            --property="CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_KILL CAP_AUDIT_WRITE" \
            --property="RestrictAddressFamilies=AF_UNIX AF_NETLINK" \
            --property="TasksMax=32" \
            /usr/bin/python3 -I -B /tmp/jason-audit-writer-systemd-probe.py
          echo "TEST_AMBIENT_SETUID_ONLY_START"
          timeout 50s sudo systemd-run --wait --collect --pipe \
            --unit="audit-uid-boundary-ci-ambient-$GITHUB_RUN_ID" \
            --property="User=root" \
            --property="Group=root" \
            --property="NoNewPrivileges=yes" \
            --property="CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID CAP_SYS_ADMIN CAP_SYS_PTRACE CAP_KILL CAP_AUDIT_WRITE" \
            --property="AmbientCapabilities=CAP_SETUID" \
            --property="RestrictAddressFamilies=AF_UNIX AF_NETLINK" \
            --property="TasksMax=32" \
            /usr/bin/python3 -I -B /tmp/jason-audit-writer-systemd-probe.py
