name: Validate Provider Secret Provisioning

on:
  pull_request:
    paths:
      - 'tools/provider_secret_provision.py'
      - 'tools/provider_secret_kv_write.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_kv_write.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/connectors/tests/test_openbao_secrets.py'
      - '03-Components/Kernel/JKD-003-Secrets-Broker.md'
      - '07-Operations/Provider-Secret-Provisioning.md'
      - '.github/workflows/provider-secret-provisioning.yml'
  push:
    paths:
      - 'tools/provider_secret_provision.py'
      - 'tools/provider_secret_kv_write.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_kv_write.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/connectors/tests/test_openbao_secrets.py'
      - '03-Components/Kernel/JKD-003-Secrets-Broker.md'
      - '07-Operations/Provider-Secret-Provisioning.md'
      - '.github/workflows/provider-secret-provisioning.yml'

jobs:
  validate-provider-secret-provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile provider secret boundary
        run: |
          python -m py_compile tools/provider_secret_provision.py
          python -m py_compile tools/provider_secret_kv_write.py
          python -m py_compile implementation/connectors/core/openbao_secrets.py

      - name: Run provider architecture invariants
        run: |
          python -m pytest tools/tests/test_provider_secret_provision.py -q
          python -m pytest tools/tests/test_provider_secret_kv_write.py -q

      - name: Run canonical OpenBao resolver tests
        env:
          PYTHONPATH: implementation
        run: python -m pytest implementation/connectors/tests/test_openbao_secrets.py -q

      - name: Verify DRMM credential-safe preflight
        run: |
          python tools/provider_secret_provision.py datto_rmm --check-only > /tmp/preflight.json
          python - <<'PY'
          import json
          with open('/tmp/preflight.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'pass'
          assert result['network_contacted'] is False
          assert result['secret_entered'] is False
          assert result['runtime_authentication'] == 'approle'
          assert result['runtime_token_persisted'] is False
          assert result['fields'] == ['api_url', 'api_key', 'api_secret']
          PY
          python tools/provider_secret_kv_write.py datto_rmm --check-only > /tmp/cas-preflight.json
          python - <<'PY'
          import json
          with open('/tmp/cas-preflight.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'pass'
          assert result['write_semantics'] == 'kv_v2_compare_and_set'
          assert result['network_contacted'] is False
          assert result['secret_entered'] is False
          PY

      - name: Reject persistent provider runtime token regression
        run: |
          if grep -nE 'openbao-provider\.token|create-orphan|period.?24h' tools/provider_secret_provision.py tools/provider_secret_kv_write.py; then
            echo '[FAIL] Persistent/shared provider runtime token pattern detected.'
            exit 1
          fi
          echo '[PASS] No persistent provider runtime token pattern detected.'
