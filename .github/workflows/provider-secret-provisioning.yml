name: Validate Provider Secret Provisioning

on:
  pull_request:
    paths:
      - 'tools/provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - '07-Operations/Provider-Secret-Provisioning.md'
      - '.github/workflows/provider-secret-provisioning.yml'
  push:
    paths:
      - 'tools/provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - '07-Operations/Provider-Secret-Provisioning.md'
      - '.github/workflows/provider-secret-provisioning.yml'

jobs:
  validate-provider-secret-provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile provisioning tool
        run: python -m py_compile tools/provider_secret_provision.py
      - name: Run focused tests
        run: python -m pytest tools/tests/test_provider_secret_provision.py -q
      - name: Verify credential-safe check-only
        run: |
          python tools/provider_secret_provision.py datto_rmm --check-only > /tmp/preflight.json
          python - <<'PY'
          import json
          with open('/tmp/preflight.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'pass'
          assert result['network_contacted'] is False
          assert result['secret_entered'] is False
          assert result['fields'] == ['api_url', 'api_key', 'api_secret']
          PY
