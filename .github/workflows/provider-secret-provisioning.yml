name: Validate Provider Secret Provisioning

on:
  pull_request:
    paths:
      - 'tools/provider_secret.py'
      - 'tools/provider_secret_lifecycle.py'
      - 'tools/provider_secret_provision.py'
      - 'tools/provider_secret_kv_write.py'
      - 'tools/tests/test_provider_secret_lifecycle.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_kv_write.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/connectors/tests/test_openbao_secrets.py'
      - '03-Components/Kernel/JKD-003-Secrets-Broker.md'
      - '07-Operations/Provider-Secret-Provisioning.md'
      - '.github/workflows/provider-secret-provisioning.yml'
  push:
    paths:
      - 'tools/provider_secret.py'
      - 'tools/provider_secret_lifecycle.py'
      - 'tools/provider_secret_provision.py'
      - 'tools/provider_secret_kv_write.py'
      - 'tools/tests/test_provider_secret_lifecycle.py'
      - 'tools/tests/test_provider_secret_provision.py'
      - 'tools/tests/test_provider_secret_kv_write.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/connectors/tests/test_openbao_secrets.py'
      - '03-Components/Kernel/JKD-003-Secrets-Broker.md'
      - '07-Operations/Provider-Secret-Provisioning.md'
      - '.github/workflows/provider-secret-provisioning.yml'

jobs:
  validate-provider-secret-provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile provider secret boundary
        run: |
          python -m py_compile tools/provider_secret.py
          python -m py_compile tools/provider_secret_lifecycle.py
          python -m py_compile tools/provider_secret_provision.py
          python -m py_compile tools/provider_secret_kv_write.py
          python -m py_compile implementation/connectors/core/openbao_secrets.py

      - name: Run provider lifecycle and architecture invariants
        run: |
          python -m pytest tools/tests/test_provider_secret_lifecycle.py -q
          python -m pytest tools/tests/test_provider_secret_provision.py -q
          python -m pytest tools/tests/test_provider_secret_kv_write.py -q

      - name: Run canonical OpenBao resolver tests
        env:
          PYTHONPATH: implementation
        run: python -m pytest implementation/connectors/tests/test_openbao_secrets.py -q

      - name: Verify canonical lifecycle preflights
        run: |
          for provider in datto_rmm aws_ses; do
            for action in status create update verify rotate-identity deactivate reactivate; do
              python tools/provider_secret.py "$action" "$provider" --check-only > "/tmp/${provider}-${action}.json"
              PROVIDER="$provider" ACTION="$action" python - <<'PY'
          import json, os
          action = os.environ['ACTION']
          provider = os.environ['PROVIDER']
          with open(f'/tmp/{provider}-{action}.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'pass'
          assert result['provider'] == provider
          assert result['action'] == action
          assert result['network_contacted'] is False
          assert result['secret_entered'] is False
          assert result['runtime_authentication'] == 'approle'
          assert result['runtime_token_persisted'] is False
          assert result['kv_write_semantics'] == 'kv_v2_compare_and_set'
          assert result['deactivation_semantics'] == 'revoke_runtime_identity_preserve_kv_history'
          PY
            done
          done

      - name: Verify legacy credential-safe helpers remain compatible
        run: |
          python tools/provider_secret_provision.py datto_rmm --check-only > /tmp/preflight.json
          python tools/provider_secret_kv_write.py datto_rmm --check-only > /tmp/cas-preflight.json
          python tools/provider_secret_provision.py aws_ses --check-only > /tmp/ses-preflight.json
          python tools/provider_secret_kv_write.py aws_ses --check-only > /tmp/ses-cas-preflight.json
          python - <<'PY'
          import json
          for path in (
              '/tmp/preflight.json',
              '/tmp/cas-preflight.json',
              '/tmp/ses-preflight.json',
              '/tmp/ses-cas-preflight.json',
          ):
              with open(path, encoding='utf-8') as handle:
                  result = json.load(handle)
              if 'runtime_authentication' in result:
                  assert result['runtime_authentication'] == 'approle'
                  assert result['runtime_token_persisted'] is False
              if 'write_semantics' in result:
                  assert result['write_semantics'] == 'kv_v2_compare_and_set'
          PY

      - name: Enforce lifecycle documentation invariants
        run: |
          grep -q 'python3 tools/provider_secret.py <action> <provider>' 07-Operations/Provider-Secret-Provisioning.md
          grep -q 'auth/token/revoke-self' 07-Operations/Provider-Secret-Provisioning.md
          grep -q 'compare-and-set' 03-Components/Kernel/JKD-003-Secrets-Broker.md
          grep -q 'deactivate' 03-Components/Kernel/JKD-003-Secrets-Broker.md
          grep -q 'reactivate' 03-Components/Kernel/JKD-003-Secrets-Broker.md

      - name: Reject persistent-token and lifecycle bypass regressions
        run: |
          FILES='tools/provider_secret.py tools/provider_secret_lifecycle.py tools/provider_secret_provision.py tools/provider_secret_kv_write.py'
          if grep -nE 'openbao-provider\.token|create-orphan|period.?24h' $FILES; then
            echo '[FAIL] Persistent/shared provider runtime token pattern detected.'
            exit 1
          fi
          if grep -n 'payload={"data":' tools/provider_secret_lifecycle.py; then
            echo '[FAIL] Blind KV write detected in canonical lifecycle tool.'
            exit 1
          fi
          echo '[PASS] Provider secret lifecycle invariants enforced.'
