name: Audit Full Health P0 Recovery
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/audit_full_health_p0_*.py'
      - 'tools/tests/test_audit_full_health_p0_recovery.py'
      - 'tools/tests/audit_full_health_p0_root_fixture.py'
      - 'infrastructure/jason-audit-full-health-p0/**'
      - '.dockerignore'
      - 'config/audit-full-health-p0-recovery.conf'
      - 'docs/engineering/Audit-Full-Health-P0-Recovery-20261122.md'
      - '.github/workflows/audit-full-health-p0-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-owner-scope-and-real-sqlite-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest ./implementation
      - name: Real SQLite FULL proof, tested fail-closed Owner and breaker controls
        env:
          PYTHONPATH: .:tools:implementation
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m pytest -o addopts='' -q -p no:cacheprovider \
            tools/tests/test_audit_full_health_p0_recovery.py \
            tools/tests/test_audit_journal_health.py \
            tools/tests/test_audit_journal_health_native.py \
            tools/tests/test_openclaw_authority_operational_health.py \
            tools/tests/test_openclaw_authority_fast_health.py \
            tools/tests/test_openclaw_authority_health_snapshot.py
          python -m py_compile \
            tools/audit_full_health_p0_recovery.py \
            tools/audit_full_health_p0_snapshot.py \
            tools/audit_full_health_p0_operational.py
          test ! -e /etc/jason-owner-release/audit-full-health-p0-20261122
          test ! -e /var/lib/jason/governed-ticket-shared/orchestration-events.sqlite3
          test ! -e /usr/local/lib/jason/audit-full-health-p0-20261122
      - name: Native Root/UID1000 custody, one-use claim and exact rollback (no host mounts)
        run: |
          docker build --network=none -f infrastructure/jason-audit-full-health-p0/tests.Dockerfile -t audit-full-health-p0-root-fixture .
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=FOWNER --cap-add=SETGID --cap-add=SETUID --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=2g audit-full-health-p0-root-fixture
