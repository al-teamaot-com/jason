name: PMv4 A1 previously approved rollback reconciliation
on:
  pull_request:
    paths:
      - "tools/pmv4_a1_pending_exact_recovery.py"
      - "tools/pmv4_a1_recover_existing_owner_local.sh"
      - "tests/test_pmv4_a1_pending_exact_recovery.py"
      - ".github/workflows/pmv4-a1-pending-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-new-owner-a1-recovery:
    name: Source-only original A1 signed rollback and foreign-target denial
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact historic owner binding, native ledger, signed rollback acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest cryptography
          PYTHONPATH=implementation:. python -B -m pytest -q \
            tests/test_pmv4_a1_pending_exact_recovery.py \
            tests/test_pmv4_shadow_release.py \
            tests/test_pmv4_shadow_docker_adapter.py \
            tests/test_pmv4_host_release_guard.py
          bash -n tools/pmv4_a1_recover_existing_owner_local.sh
          python -B -m py_compile tools/pmv4_a1_pending_exact_recovery.py
          test ! -e /run/jason-pmv4-a1-reconcile-8c20
