name: Validate Provider Read Runtime Activation

on:
  pull_request:
    paths:
      - 'implementation/runtime_service/src/jason_runtime/provider_read_activation.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/tests/test_provider_read_activation.py'
      - 'infrastructure/jason-runtime/compose.yaml'
      - '.github/workflows/provider-read-runtime-activation.yml'
  push:
    paths:
      - 'implementation/runtime_service/src/jason_runtime/provider_read_activation.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/tests/test_provider_read_activation.py'
      - 'infrastructure/jason-runtime/compose.yaml'
      - '.github/workflows/provider-read-runtime-activation.yml'

jobs:
  provider-read-runtime-activation:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/cap-007/src:implementation/connectors/openclaw/src:implementation/runtime_service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install ./implementation ./implementation/connectors/openclaw ./implementation/runtime_service
      - name: Compile activation boundary
        run: |
          python -m py_compile \
            implementation/runtime_service/src/jason_runtime/provider_read_activation.py \
            implementation/runtime_service/src/jason_runtime/provider_reads.py
      - name: Test fail-closed activation contract
        run: |
          python -m pytest -q \
            implementation/runtime_service/tests/test_provider_read_activation.py \
            implementation/runtime_service/tests/test_provider_reads.py
      - name: Prove governed catalog activation crosses the Compose boundary
        run: |
          grep -F 'JASON_PROVIDER_READ_ACTIVATION_PROFILE: ${JASON_PROVIDER_READ_ACTIVATION_PROFILE:-}' infrastructure/jason-runtime/compose.yaml
          export JASON_PROVIDER_READ_ACTIVATION_PROFILE=itglue-autotask-governed-catalog-v3
          export JASON_OLLAMA_MODEL=ci-local-model
          export JASON_OPENBAO_ROLE_ID_HOST_PATH=/tmp/base-role-id
          export JASON_OPENBAO_SECRET_ID_HOST_PATH=/tmp/base-secret-id
          export JASON_SES_OPENBAO_ROLE_ID_HOST_PATH=/tmp/ses-role-id
          export JASON_SES_OPENBAO_SECRET_ID_HOST_PATH=/tmp/ses-secret-id
          export JASON_MICROSOFT_OPENBAO_ROLE_ID_HOST_PATH=/tmp/microsoft-role-id
          export JASON_MICROSOFT_OPENBAO_SECRET_ID_HOST_PATH=/tmp/microsoft-secret-id
          export JASON_OPENAI_OPENBAO_ROLE_ID_HOST_PATH=/tmp/openai-role-id
          export JASON_OPENAI_OPENBAO_SECRET_ID_HOST_PATH=/tmp/openai-secret-id
          export JASON_IT_GLUE_OPENBAO_ROLE_ID_HOST_PATH=/tmp/itglue-role-id
          export JASON_IT_GLUE_OPENBAO_SECRET_ID_HOST_PATH=/tmp/itglue-secret-id
          export JASON_AUTOTASK_OPENBAO_ROLE_ID_HOST_PATH=/tmp/autotask-role-id
          export JASON_AUTOTASK_OPENBAO_SECRET_ID_HOST_PATH=/tmp/autotask-secret-id
          docker compose -f infrastructure/jason-runtime/compose.yaml config > /tmp/jason-runtime-rendered.yaml
          grep -F 'JASON_PROVIDER_READ_ACTIVATION_PROFILE: itglue-autotask-governed-catalog-v3' /tmp/jason-runtime-rendered.yaml
          echo 'PROVIDER_READ_ACTIVATION_COMPOSE_BOUNDARY=PASS'
      - name: Prove no provider-specific MCP tools were introduced
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('implementation/mcp_service/src/jason_mcp/server.py').read_text(encoding='utf-8')
          assert '@mcp.tool' in server
          for forbidden in (
              'it_glue_search',
              'it_glue_read',
              'autotask_search',
              'autotask_read',
          ):
              assert forbidden not in server
          assert 'discover_capabilities' in server
          assert 'execute_read_capability' in server
          print('MCP_PROVIDER_SPECIFIC_TOOLS=NO')
          print('MCP_CANONICAL_READ_SURFACE=PASS')
          PY
      - name: Prove governed provider catalogs activate without per-resource allowlists
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          from kernel.capabilities import (
              CapabilityLifecycle,
              CapabilityRegistryService,
              InMemoryCapabilityRegistry,
          )
          from kernel.execution_providers import (
              ExecutionProviderRegistryService,
              InMemoryExecutionProviderRegistry,
          )
          from orchestrator.provider_read_capability_catalog import (
              AUTOTASK_CAPABILITIES,
              AUTOTASK_PROVIDER,
              IT_GLUE_CAPABILITIES,
              IT_GLUE_PROVIDER,
              register_provider_read_foundation,
          )
          from jason_runtime.provider_read_activation import (
              PROVIDER_READ_GOVERNED_CATALOG_CAPABILITIES,
              PROVIDER_READ_GOVERNED_CATALOG_PROFILE,
              apply_provider_read_activation_profile,
          )

          capabilities = CapabilityRegistryService(registry=InMemoryCapabilityRegistry())
          providers = ExecutionProviderRegistryService(registry=InMemoryExecutionProviderRegistry())
          register_provider_read_foundation(
              capabilities=capabilities,
              providers=providers,
              now=datetime(2026, 9, 10, tzinfo=timezone.utc),
          )
          state = apply_provider_read_activation_profile(
              capabilities=capabilities,
              providers=providers,
              profile=PROVIDER_READ_GOVERNED_CATALOG_PROFILE,
          )

          expected = IT_GLUE_CAPABILITIES | AUTOTASK_CAPABILITIES
          assert PROVIDER_READ_GOVERNED_CATALOG_CAPABILITIES == expected
          assert set(state.capability_names) == expected
          assert set(state.provider_ids) == {IT_GLUE_PROVIDER, AUTOTASK_PROVIDER}

          for name in expected:
              capability = capabilities.get(capability_name=name, version='1.0')
              assert capability.lifecycle_status is CapabilityLifecycle.ACTIVE
              assert capability.metadata.get('provider_neutral') == 'true'
              assert capability.metadata.get('read_only') == 'true'
              assert capability.permitted_execution_modes == frozenset({'deterministic'})
              assert capability.approval.required is False

          for provider_id in state.provider_ids:
              provider = providers.get(provider_id)
              assert provider.pricing_profile_id == 'zero-cost-foundation'
              assert provider.execution_modes == frozenset({'deterministic'})

          print('PROVIDER_READ_GOVERNED_CATALOG_PROFILE=PASS')
          print(f'ACTIVE_PROVIDER_READ_CAPABILITIES={len(expected)}')
          print('PER_RESOURCE_ACTIVATION_ALLOWLIST=NO')
          print('PROVIDER_TRUST_BOUNDARY=EXPLICIT')
          print('READ_ONLY=TRUE')
          print('DETERMINISTIC_ONLY=TRUE')
          print('JASON_SIDE_MODEL_COST=0')
          PY
