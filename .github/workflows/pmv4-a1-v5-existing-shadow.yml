name: PMv4 A1 v5 existing release recovery source-only
on:
  pull_request:
    paths:
      - "tools/pmv4_a1_v5_existing_release_builder.py"
      - "tests/test_pmv4_a1_v5_existing_release_builder.py"
      - ".github/workflows/pmv4-a1-v5-existing-shadow.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-existing-release-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate existing-release approval, scoped Docker and prior stopped rollback
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest cryptography
          PYTHONPATH=implementation:implementation/mcp_service/src:tests:. python -B -m pytest -q \
            tests/test_pmv4_a1_v5_existing_release_builder.py \
            tests/test_pmv4_a1_v4_immutable_builder.py \
            tests/test_pmv4_a1_atomic_shadow_root.py \
            tests/test_pmv4_a1_atomic_one_owner.py \
            tests/test_pmv4_shadow_candidate_packet.py \
            tests/test_pmv4_shadow_release.py \
            tests/test_pmv4_shadow_docker_adapter.py \
            tests/test_pmv4_a1_shadow_resource_capacity.py \
            tests/test_pmv4_shadow_runtime_profile.py \
            tests/test_pmv4_host_release_guard.py
          python -B -m py_compile tools/pmv4_a1_v5_existing_release_builder.py
          test ! -e /var/lib/jason/pmv4-shadow/receipts
          test ! -e /etc/jason/release-readback-recovery/production-desired-state.json
