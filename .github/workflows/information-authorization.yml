name: Validate Information Authorization Boundary

on:
  pull_request:
    paths:
      - 'implementation/orchestrator/information_authorization.py'
      - 'implementation/orchestrator/information_sensitivity.py'
      - 'implementation/orchestrator/provider_read_information_authorizer.py'
      - 'implementation/orchestrator/tests/test_information_authorization.py'
      - 'implementation/orchestrator/tests/test_information_sensitivity.py'
      - 'implementation/orchestrator/tests/test_information_release_boundary.py'
      - 'implementation/orchestrator/tests/test_provider_read_information_authorizer.py'
      - 'implementation/orchestrator/service.py'
      - 'implementation/orchestrator/contracts.py'
      - 'implementation/orchestrator/teams_request_factory.py'
      - 'implementation/connectors/it_glue/operations.py'
      - 'implementation/connectors/tests/test_it_glue_operations.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - '.github/workflows/information-authorization.yml'
  push:
    paths:
      - 'implementation/orchestrator/information_authorization.py'
      - 'implementation/orchestrator/information_sensitivity.py'
      - 'implementation/orchestrator/provider_read_information_authorizer.py'
      - 'implementation/orchestrator/tests/test_information_authorization.py'
      - 'implementation/orchestrator/tests/test_information_sensitivity.py'
      - 'implementation/orchestrator/tests/test_information_release_boundary.py'
      - 'implementation/orchestrator/tests/test_provider_read_information_authorizer.py'
      - 'implementation/orchestrator/service.py'
      - 'implementation/orchestrator/contracts.py'
      - 'implementation/orchestrator/teams_request_factory.py'
      - 'implementation/connectors/it_glue/operations.py'
      - 'implementation/connectors/tests/test_it_glue_operations.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - '.github/workflows/information-authorization.yml'

jobs:
  validate-information-authorization:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/cap-007/src:implementation/connectors/openclaw/src:implementation/runtime_service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install ./implementation ./implementation/connectors/openclaw ./implementation/runtime_service
      - name: Compile information authorization boundary
        run: |
          python -m py_compile \
            implementation/orchestrator/information_authorization.py \
            implementation/orchestrator/information_sensitivity.py \
            implementation/orchestrator/provider_read_information_authorizer.py \
            implementation/orchestrator/service.py \
            implementation/orchestrator/contracts.py \
            implementation/orchestrator/teams_request_factory.py \
            implementation/connectors/it_glue/operations.py \
            implementation/runtime_service/src/jason_runtime/provider_reads.py \
            implementation/orchestrator/tests/test_information_authorization.py \
            implementation/orchestrator/tests/test_information_sensitivity.py \
            implementation/orchestrator/tests/test_information_release_boundary.py \
            implementation/orchestrator/tests/test_provider_read_information_authorizer.py \
            implementation/connectors/tests/test_it_glue_operations.py
      - name: Test fail-closed information authorization contract
        run: |
          python -m pytest -q \
            implementation/orchestrator/tests/test_information_authorization.py \
            implementation/orchestrator/tests/test_information_sensitivity.py \
            implementation/orchestrator/tests/test_information_release_boundary.py \
            implementation/orchestrator/tests/test_provider_read_information_authorizer.py \
            implementation/connectors/tests/test_it_glue_operations.py
