name: PMv4 A1 isolated shadow runtime limits and host error fidelity
on:
  pull_request:
    paths:
      - "config/pmv4-shadow/docker-compose.yml"
      - "tools/pmv4_host_release_guard.py"
      - "tests/test_pmv4_a1_shadow_resource_capacity.py"
      - "tests/test_pmv4_a1_shadow_host_error_propagation.py"
      - ".github/workflows/pmv4-a1-runtime-capacity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-shadow-capacity-and-exact-errors:
    name: PMv4 A1 bounded shadow resources, preserved isolation and native lock error attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare one isolated Compose profile against protected main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          PYTHONPATH=implementation:. python -B -m pytest -q \
            tests/test_pmv4_a1_shadow_resource_capacity.py \
            tests/test_pmv4_a1_shadow_host_error_propagation.py \
            tests/test_pmv4_shadow_runtime_profile.py \
            tests/test_pmv4_host_release_guard.py
          python -B -m py_compile tools/pmv4_host_release_guard.py
          test ! -e /var/lib/jason/pmv4-shadow/receipts
