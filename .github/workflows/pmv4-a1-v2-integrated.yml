name: PMv4 A1 integrated shadow source release candidate
on:
  pull_request:
    paths:
      - "config/pmv4-shadow/docker-compose.yml"
      - "tools/pmv4_host_release_guard.py"
      - "tools/pmv4_shadow_docker_adapter.py"
      - "tools/pmv4_a1_atomic_one_owner.py"
      - "tools/pmv4_a1_atomic_shadow_root.py"
      - "tools/pmv4_a1_one_owner_local.sh"
      - "tests/test_pmv4_a1_*"
      - ".github/workflows/pmv4-a1-v2-integrated.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-integrated-a1-shadow:
    name: Verify A1 Docker 29, bounded resources, signed immutable scope, native rollback and dual-lock semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrated source acceptance without any release mutation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest cryptography
          PYTHONPATH=implementation:implementation/mcp_service/src:tests:. python -B -m pytest -q \
            tests/test_pmv4_a1_atomic_shadow_root.py \
            tests/test_pmv4_a1_atomic_one_owner.py \
            tests/test_pmv4_shadow_candidate_packet.py \
            tests/test_pmv4_shadow_release.py \
            tests/test_pmv4_shadow_ci.py \
            tests/test_pmv4_shadow_docker_adapter.py \
            tests/test_pmv4_shadow_owner_issuer.py \
            tests/test_pmv4_shadow_runtime_profile.py \
            tests/test_pmv4_host_release_guard.py \
            tests/test_pmv4_a1_shadow_resource_capacity.py \
            tests/test_pmv4_a1_shadow_host_error_propagation.py
          bash -n tools/pmv4_a1_one_owner_local.sh
          python -B -m py_compile \
            tools/pmv4_a1_atomic_one_owner.py \
            tools/pmv4_a1_atomic_shadow_root.py \
            tools/pmv4_host_release_guard.py
          test ! -e /var/lib/jason/pmv4-shadow/receipts
