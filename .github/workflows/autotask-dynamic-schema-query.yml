name: Autotask Dynamic Schema Query Guard

on:
  pull_request:
    paths:
      - 'implementation/connectors/autotask/dynamic_schema_read.py'
      - 'implementation/connectors/autotask/impersonating_connector.py'
      - 'implementation/connectors/autotask/operations.py'
      - 'implementation/orchestrator/provider_read_argument_adapter.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_read_activation.py'
      - 'tools/release_manager_host_runner.py'
      - 'implementation/connectors/tests/test_autotask_dynamic_schema_query.py'
      - 'implementation/runtime_service/tests/test_provider_read_entra_activation.py'
      - 'tools/tests/test_autotask_read_profile_release.py'
      - 'tools/tests/test_autotask_release_deploy_profile.py'
      - 'infrastructure/jason-runtime/production-deploy.sh'
      - 'infrastructure/jason-mcp/production-deploy.sh'
      - '.github/workflows/autotask-dynamic-schema-query.yml'
  push:
    paths:
      - 'implementation/connectors/autotask/dynamic_schema_read.py'
      - 'implementation/connectors/autotask/impersonating_connector.py'
      - 'implementation/connectors/autotask/operations.py'
      - 'implementation/orchestrator/provider_read_argument_adapter.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_read_activation.py'
      - 'tools/release_manager_host_runner.py'
      - 'implementation/connectors/tests/test_autotask_dynamic_schema_query.py'
      - 'implementation/runtime_service/tests/test_provider_read_entra_activation.py'
      - 'tools/tests/test_autotask_read_profile_release.py'
      - 'tools/tests/test_autotask_release_deploy_profile.py'
      - 'infrastructure/jason-runtime/production-deploy.sh'
      - 'infrastructure/jason-mcp/production-deploy.sh'
      - '.github/workflows/autotask-dynamic-schema-query.yml'

jobs:
  prove-dynamic-read-only:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/runtime_service/src:implementation/cap-007/src:implementation/connectors/openclaw/src:tools:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source test dependencies
        run: |
          python -m pip install pytest
          python -m pip install ./implementation ./implementation/connectors/openclaw ./implementation/runtime_service
      - name: Validate dynamic read compiler and provider GET safeguards
        run: |
          python -m py_compile \
            implementation/connectors/autotask/dynamic_schema_read.py \
            implementation/connectors/autotask/impersonating_connector.py \
            implementation/connectors/autotask/operations.py \
            implementation/orchestrator/provider_read_argument_adapter.py \
            implementation/runtime_service/src/jason_runtime/provider_read_activation.py \
            tools/release_manager_host_runner.py
      - name: Verify live-schema validation, pagination, negative scope and legacy profiles
        run: |
          python -m pytest -q \
            implementation/connectors/tests/test_autotask_dynamic_schema_query.py \
            implementation/connectors/tests/test_autotask_operations.py \
            implementation/connectors/tests/test_autotask_impersonating_connector.py \
            implementation/orchestrator/tests/test_autotask_v12_read_extensions.py \
            implementation/orchestrator/tests/test_autotask_generic_read_coverage.py \
            implementation/runtime_service/tests/test_provider_read_entra_activation.py \
            tools/tests/test_autotask_read_profile_release.py \
            tools/tests/test_autotask_release_deploy_profile.py
