name: Governed SharePoint Reader
on:
  pull_request:
    paths:
      - 'implementation/connectors/microsoft_graph/sharepoint_*.py'
      - 'implementation/connectors/microsoft_graph/site_access_registry.py'
      - 'implementation/connectors/microsoft_graph/site_discovery.py'
      - 'implementation/connectors/microsoft_graph/site_gated_connector.py'
      - 'implementation/connectors/microsoft_graph/site_access_admin.py'
      - 'implementation/connectors/microsoft_graph/aot_site_document_policy.py'
      - 'implementation/connectors/microsoft_graph/test_aot_site_document_policy.py'
      - 'implementation/connectors/microsoft_graph/site_control_http.py'
      - 'implementation/connectors/microsoft_graph/test_site_control_http.py'
      - 'tools/sharepoint_site_access_service.py'
      - 'tools/sharepoint_grafana_install.py'
      - 'tools/sharepoint_release_preflight.py'
      - 'tools/sharepoint_install_package.py'
      - 'tools/tests/test_sharepoint_install_package.py'
      - 'docs/releases/SharePoint-Install-Rollback-20261123.md'
      - 'tools/tests/test_sharepoint_release_preflight.py'
      - 'tools/tests/test_sharepoint_grafana_install.py'
      - 'infrastructure/sharepoint-site-control/**'
      - 'infrastructure/sharepoint-site-control/grafana/jason-sharepoint-site-access.json'
      - 'infrastructure/sharepoint-site-control/grafana/sharepoint-control.yaml.example'
      - 'implementation/connectors/microsoft_graph/test_site_access_registry.py'
      - 'implementation/connectors/microsoft_graph/test_site_discovery.py'
      - 'implementation/connectors/microsoft_graph/test_site_gated_connector.py'
      - 'implementation/connectors/microsoft_graph/test_site_access_admin.py'
      - 'implementation/connectors/microsoft_graph/aot_document_policy.py'
      - 'implementation/connectors/microsoft_graph/test_aot_document_policy.py'
      - 'implementation/connectors/microsoft_graph/test_sharepoint_*.py'
      - 'implementation/runtime_service/src/jason_runtime/microsoft_sharepoint.py'
      - 'implementation/orchestrator/sharepoint_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/sharepoint_read_activation.py'
      - 'implementation/runtime_service/src/jason_runtime/sharepoint_reads.py'
      - 'implementation/runtime_service/tests/test_sharepoint_read_activation.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - 'implementation/runtime_service/tests/test_microsoft_sharepoint.py'
      - 'tools/provider_secret_provision.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/kernel/client_boundaries/sqlite.py'
      - 'implementation/kernel/tests/test_client_boundaries_sqlite.py'
      - '.github/workflows/sharepoint-reader.yml'
  push:
    paths:
      - 'implementation/connectors/microsoft_graph/sharepoint_*.py'
      - 'implementation/connectors/microsoft_graph/site_access_registry.py'
      - 'implementation/connectors/microsoft_graph/site_discovery.py'
      - 'implementation/connectors/microsoft_graph/site_gated_connector.py'
      - 'implementation/connectors/microsoft_graph/site_access_admin.py'
      - 'implementation/connectors/microsoft_graph/aot_site_document_policy.py'
      - 'implementation/connectors/microsoft_graph/test_aot_site_document_policy.py'
      - 'implementation/connectors/microsoft_graph/site_control_http.py'
      - 'implementation/connectors/microsoft_graph/test_site_control_http.py'
      - 'tools/sharepoint_site_access_service.py'
      - 'tools/sharepoint_grafana_install.py'
      - 'tools/sharepoint_release_preflight.py'
      - 'tools/sharepoint_install_package.py'
      - 'tools/tests/test_sharepoint_install_package.py'
      - 'docs/releases/SharePoint-Install-Rollback-20261123.md'
      - 'tools/tests/test_sharepoint_release_preflight.py'
      - 'tools/tests/test_sharepoint_grafana_install.py'
      - 'infrastructure/sharepoint-site-control/**'
      - 'infrastructure/sharepoint-site-control/grafana/jason-sharepoint-site-access.json'
      - 'infrastructure/sharepoint-site-control/grafana/sharepoint-control.yaml.example'
      - 'implementation/connectors/microsoft_graph/test_site_access_registry.py'
      - 'implementation/connectors/microsoft_graph/test_site_discovery.py'
      - 'implementation/connectors/microsoft_graph/test_site_gated_connector.py'
      - 'implementation/connectors/microsoft_graph/test_site_access_admin.py'
      - 'implementation/connectors/microsoft_graph/aot_document_policy.py'
      - 'implementation/connectors/microsoft_graph/test_aot_document_policy.py'
      - 'implementation/connectors/microsoft_graph/test_sharepoint_*.py'
      - 'implementation/runtime_service/src/jason_runtime/microsoft_sharepoint.py'
      - 'implementation/orchestrator/sharepoint_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/sharepoint_read_activation.py'
      - 'implementation/runtime_service/src/jason_runtime/sharepoint_reads.py'
      - 'implementation/runtime_service/tests/test_sharepoint_read_activation.py'
      - 'implementation/runtime_service/src/jason_runtime/composition.py'
      - 'implementation/runtime_service/tests/test_microsoft_sharepoint.py'
      - 'tools/provider_secret_provision.py'
      - 'implementation/connectors/core/openbao_secrets.py'
      - 'implementation/kernel/client_boundaries/sqlite.py'
      - 'implementation/kernel/tests/test_client_boundaries_sqlite.py'
      - '.github/workflows/sharepoint-reader.yml'
jobs:
  reader-and-secret-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile and run focused tests
        env:
          PYTHONPATH: implementation:implementation/runtime_service/src
        run: |
          python -m py_compile implementation/connectors/microsoft_graph/sharepoint_reader.py
          python -m py_compile implementation/connectors/microsoft_graph/sharepoint_connector.py
          python -m py_compile implementation/connectors/microsoft_graph/aot_document_policy.py
          python -m py_compile implementation/connectors/microsoft_graph/sharepoint_manifest.py
          python -m py_compile implementation/connectors/microsoft_graph/site_access_registry.py
          python -m py_compile implementation/connectors/microsoft_graph/site_discovery.py
          python -m py_compile implementation/connectors/microsoft_graph/site_gated_connector.py
          python -m py_compile implementation/connectors/microsoft_graph/site_access_admin.py
          python -m py_compile implementation/connectors/microsoft_graph/aot_site_document_policy.py
          python -m py_compile implementation/connectors/microsoft_graph/site_control_http.py
          python -m py_compile tools/sharepoint_site_access_service.py
          python -m py_compile tools/sharepoint_grafana_install.py
          python -m py_compile tools/sharepoint_release_preflight.py
          python -m py_compile tools/sharepoint_install_package.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/microsoft_sharepoint.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/sharepoint_reads.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/sharepoint_read_activation.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/composition.py
          python -m py_compile implementation/orchestrator/sharepoint_capability_catalog.py
          python -m pytest -q implementation/kernel/tests/test_client_boundaries_sqlite.py implementation/connectors/microsoft_graph/test_site_access_registry.py implementation/connectors/microsoft_graph/test_site_discovery.py implementation/connectors/microsoft_graph/test_site_gated_connector.py implementation/connectors/microsoft_graph/test_site_access_admin.py implementation/connectors/microsoft_graph/test_aot_site_document_policy.py implementation/connectors/microsoft_graph/test_site_control_http.py implementation/connectors/microsoft_graph/test_sharepoint_reader.py implementation/connectors/microsoft_graph/test_sharepoint_connector.py implementation/connectors/microsoft_graph/test_sharepoint_manifest.py implementation/connectors/microsoft_graph/test_aot_document_policy.py implementation/runtime_service/tests/test_microsoft_sharepoint.py implementation/runtime_service/tests/test_sharepoint_read_activation.py tools/tests/test_provider_secret_provision.py tools/tests/test_sharepoint_grafana_install.py tools/tests/test_sharepoint_release_preflight.py tools/tests/test_sharepoint_install_package.py
      - name: Verify no-network lifecycle preflight
        run: |
          python tools/provider_secret.py create microsoft_graph_sharepoint --check-only > /tmp/check.json
          python -c 'import json; x=json.load(open("/tmp/check.json")); assert x["status"]=="pass" and x["logical_name"]=="microsoft_graph.sharepoint_read" and not x["network_contacted"] and not x["secret_entered"]'
