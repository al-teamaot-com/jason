name: Organization Matching Regressions
on:
  pull_request:
    paths:
      - 'implementation/orchestrator/organization_matching.py'
      - 'implementation/orchestrator/organization_source_adapters.py'
      - 'implementation/orchestrator/organization_match_service.py'
      - 'implementation/orchestrator/tests/test_organization_match_service.py'
      - 'implementation/orchestrator/tests/test_organization_matching.py'
      - 'implementation/orchestrator/tests/test_organization_source_adapters.py'
      - '.github/workflows/organization-matching.yml'
  push:
    paths:
      - 'implementation/orchestrator/organization_matching.py'
      - 'implementation/orchestrator/organization_source_adapters.py'
      - 'implementation/orchestrator/organization_match_service.py'
      - 'implementation/orchestrator/tests/test_organization_match_service.py'
      - 'implementation/orchestrator/tests/test_organization_matching.py'
      - 'implementation/orchestrator/tests/test_organization_source_adapters.py'
      - '.github/workflows/organization-matching.yml'
jobs:
  matching-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression runner
        run: python -m pip install pytest
      - name: Compile matcher and adapters
        run: |
          python -m py_compile implementation/orchestrator/organization_matching.py
          python -m py_compile implementation/orchestrator/organization_source_adapters.py
          python -m py_compile implementation/orchestrator/organization_match_service.py
      - name: Run pure read-only matching regression suite
        env:
          PYTHONPATH: implementation
        run: |
          python -m pytest -q implementation/orchestrator/tests/test_organization_matching.py implementation/orchestrator/tests/test_organization_source_adapters.py implementation/orchestrator/tests/test_organization_match_service.py
