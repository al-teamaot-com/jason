name: Audit Journal Migration Preparation
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/audit_journal*.py'
      - 'tools/tests/*audit_journal*.py'
      - 'tools/audit_journal_migration.py'
      - 'tools/tests/test_audit_journal_migration.py'
      - 'tools/audit_journal_control.py'
      - 'implementation/mcp_service/src/jason_mcp/audit_journal_adoption_approval.py'
      - 'implementation/mcp_service/tests/test_audit_journal_adoption_approval.py'
      - 'implementation/mcp_service/src/jason_mcp/server.py'
      - 'implementation/kernel/signed_owner_release.py'
      - 'tools/audit_journal_root_inventory.py'
      - 'tools/audit_journal_benchmark.py'
      - 'tools/tests/test_audit_journal_native.py'
      - 'tools/tests/test_audit_journal_health.py'
      - 'tools/tests/test_audit_journal_health_native.py'
      - 'tools/tests/audit_journal_root_fixture.py'
      - 'implementation/orchestrator/event_store.py'
      - 'implementation/orchestrator/segmented_journal.py'
      - 'implementation/orchestrator/journal_sql.py'
      - 'implementation/orchestrator/journal_health.py'
      - 'implementation/orchestrator/journal_recovery.py'
      - 'implementation/orchestrator/journal_mount.py'
      - 'implementation/orchestrator/journal_outcomes.py'
      - 'tools/tests/test_audit_journal_persistent_profile.py'
      - 'tools/tests/test_audit_journal_protected_peers.py'
      - 'tools/tests/test_audit_journal_abandoned_work.py'
      - 'tools/tests/test_audit_journal_work_recovery.py'
      - 'tools/audit_journal_fast_health.py'
      - 'tools/audit_journal_full_health_snapshot.py'
      - 'tools/audit_journal_operational_health.py'
      - 'infrastructure/jason-audit-journal/**'
      - 'infrastructure/jason-audit-journal-owner-executor/**'
      - 'config/operations/audit-journal-daily-archive-proposal-v1.json'
      - 'docs/engineering/Audit-Journal-Daily-Archive-Migration-v1.md'
      - '.github/workflows/audit-journal-migration-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-migration-and-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest ./implementation
      - name: Real SQLite WAL, concurrent writers and event-preserving rollback
        env:
          PYTHONPATH: .:tools:implementation:implementation/mcp_service/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m pytest -o addopts='' -q -p no:cacheprovider tools/tests/test_audit_journal_*.py implementation/mcp_service/tests/test_audit_journal_adoption_approval.py tools/tests/test_openclaw_authority_operational_health.py tools/tests/test_openclaw_authority_fast_health.py implementation/orchestrator/tests/test_event_store.py implementation/orchestrator/tests/test_reconstruction.py
          python -m json.tool config/operations/audit-journal-daily-archive-proposal-v1.json >/dev/null
          test ! -e /var/lib/jason/governed-ticket-shared/orchestration-events.sqlite3

      - name: Root-managed strict systemd private reader on synthetic readonly source
        env:
          PYTHONPATH: .:tools:implementation
        run: |
          fixture_base="$(mktemp -d /tmp/jason-private-reader-systemd-XXXXXXXX)"
          python3 -B tools/tests/audit_journal_health_reader_systemd_fixture.py prepare "$fixture_base"
          sudo systemd-run --system --wait --collect --pipe --unit=jason-private-reader-ci --property=User="$(id -un)" --property=WorkingDirectory="$GITHUB_WORKSPACE" --property=ProtectSystem=strict --property=ProtectHome=read-only --property=PrivateTmp=no --property=NoNewPrivileges=yes --property=ReadOnlyPaths="$fixture_base" --property=ReadWritePaths="$fixture_base/scratch" /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/tools/tests/audit_journal_health_reader_systemd_fixture.py" verify "$fixture_base"

      - name: Root custody, UID 1000 writer and one-use crash recovery
        run: |
          docker build --network=none -f infrastructure/jason-audit-journal/tests.Dockerfile -t audit-journal-native-fixture .
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --cap-add=FSETID --cap-add=KILL --cap-add=SYS_ADMIN --security-opt=no-new-privileges --security-opt=seccomp=unconfined --security-opt=apparmor=unconfined --tmpfs /tmp:rw,nosuid,nodev,size=8g --tmpfs /tmp/audit-native-root-fixture/archive-root:rw,nosuid,nodev,size=8g audit-journal-native-fixture

      - name: Hardened writer handoff despite required PAM session denial
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --ulimit nofile=524288:524288 --tmpfs /tmp:rw,nosuid,nodev,size=128m --tmpfs /etc/pam.d:rw,nosuid,nodev,size=1m --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /writer-context-fixture.py

      - name: Exact pre-cutover repair, immutable failure records and bounded power-loss resume
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /context-repair-fixture.py

      - name: Native admission with held mutex, deferred watchdog and immutable LKG
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /native-admission-fixture.py

      - name: Root staged Owner offer, immutable freeze, one-use signed request custody
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /signed-owner-fixture.py
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /root-worker-fixture.py
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /root-bootstrap-fixture.py
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=1g --tmpfs /run:rw,nosuid,nodev,size=8m --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /root-executor-retire-fixture.py

      - name: Native health reader exact rollback after every file publication
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=DAC_OVERRIDE --cap-add=FOWNER --security-opt=no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --entrypoint /usr/bin/python3 audit-journal-native-fixture -I -B /native-health-reader-fixture.py
