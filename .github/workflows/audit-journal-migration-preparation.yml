name: Audit Journal Migration Preparation
on:
  pull_request:
    paths:
      - 'tools/audit_journal_migration.py'
      - 'tools/tests/test_audit_journal_migration.py'
      - 'config/operations/audit-journal-daily-archive-proposal-v1.json'
      - 'docs/engineering/Audit-Journal-Daily-Archive-Migration-v1.md'
      - '.github/workflows/audit-journal-migration-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-migration-and-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest ./implementation
      - name: Real SQLite WAL, concurrent writers and event-preserving rollback
        env:
          PYTHONPATH: .:tools:implementation
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -m pytest -o addopts='' -q -p no:cacheprovider tools/tests/test_audit_journal_migration.py implementation/orchestrator/tests/test_event_store.py implementation/orchestrator/tests/test_reconstruction.py
          python -m json.tool config/operations/audit-journal-daily-archive-proposal-v1.json >/dev/null
          test ! -e /var/lib/jason/governed-ticket-shared/orchestration-events.sqlite3
