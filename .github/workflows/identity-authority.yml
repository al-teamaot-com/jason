name: Validate Identity Authority

on:
  push:
    paths:
      - "implementation/kernel/identity_authority/**"
      - "implementation/kernel/tests/test_identity_authority.py"
      - "03-Components/Kernel/JKD-001-Identity-and-Authority-Runtime-Foundation.md"
      - ".github/workflows/identity-authority.yml"
  pull_request:
    paths:
      - "implementation/kernel/identity_authority/**"
      - "implementation/kernel/tests/test_identity_authority.py"
      - "03-Components/Kernel/JKD-001-Identity-and-Authority-Runtime-Foundation.md"
      - ".github/workflows/identity-authority.yml"

permissions:
  contents: read

jobs:
  identity-authority:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install --upgrade pip pytest
      - name: Compile service
        run: python -m compileall -q implementation/kernel/identity_authority implementation/kernel/tests/test_identity_authority.py
      - name: Test identity and authority service
        run: python -m pytest implementation/kernel/tests/test_identity_authority.py -q
