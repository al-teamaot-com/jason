name: Validate Identity Authority

on:
  push:
    paths:
      - "implementation/kernel/identity_authority/**"
      - "implementation/kernel/tests/test_identity_authority.py"
      - "implementation/kernel/tests/test_delegation.py"
      - "implementation/kernel/tests/test_delegation_durable.py"
      - "implementation/orchestrator/contracts.py"
      - "implementation/orchestrator/service.py"
      - "implementation/orchestrator/authority.py"
      - "implementation/orchestrator/tests/test_service.py"
      - "implementation/connectors/openclaw/src/jason_openclaw/runtime.py"
      - "implementation/connectors/openclaw/tests/test_runtime.py"
      - "tools/identity_authority_admin.py"
      - "tools/prepare_authority_openclaw_host.sh"
      - "03-Components/Kernel/JKD-001-Identity-and-Authority-Runtime-Foundation.md"
      - ".github/workflows/identity-authority.yml"
  pull_request:
    paths:
      - "implementation/kernel/identity_authority/**"
      - "implementation/kernel/tests/test_identity_authority.py"
      - "implementation/kernel/tests/test_delegation.py"
      - "implementation/kernel/tests/test_delegation_durable.py"
      - "implementation/orchestrator/contracts.py"
      - "implementation/orchestrator/service.py"
      - "implementation/orchestrator/authority.py"
      - "implementation/orchestrator/tests/test_service.py"
      - "implementation/connectors/openclaw/src/jason_openclaw/runtime.py"
      - "implementation/connectors/openclaw/tests/test_runtime.py"
      - "tools/identity_authority_admin.py"
      - "tools/prepare_authority_openclaw_host.sh"
      - "03-Components/Kernel/JKD-001-Identity-and-Authority-Runtime-Foundation.md"
      - ".github/workflows/identity-authority.yml"

permissions:
  contents: read

jobs:
  identity-authority:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/connectors/openclaw/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install --upgrade pip pytest
      - name: Compile authority, orchestrator, OpenClaw, and admin tooling
        run: python -m compileall -q implementation/kernel/identity_authority implementation/orchestrator implementation/connectors/openclaw/src tools/identity_authority_admin.py
      - name: Validate host preparation shell
        run: bash -n tools/prepare_authority_openclaw_host.sh
      - name: Validate admin health command
        run: python tools/identity_authority_admin.py --database /tmp/jason-authority-test.sqlite3 health
      - name: Test durable identity, authority, and delegation service
        run: python -m pytest implementation/kernel/tests/test_identity_authority.py implementation/kernel/tests/test_delegation.py implementation/kernel/tests/test_delegation_durable.py -q
      - name: Test orchestrator authority-context enforcement
        run: python -m pytest implementation/orchestrator/tests/test_service.py -q
      - name: Test OpenClaw authority-context handoff
        run: python -m pytest implementation/connectors/openclaw/tests/test_runtime.py -q
