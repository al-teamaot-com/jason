name: DEB recovery pre-activation source checks

on:
  pull_request:
    paths:
      - "components/deb-recovery/**"
      - "docs/playbooks/json/candidates/backupiq_endpoint_backup.1.4.0-rc.2.json"
      - "implementation/runtime_service/src/jason_runtime/deb_recovery_verification.py"
      - "implementation/runtime_service/src/jason_runtime/deb_canary_evidence.py"
      - "implementation/runtime_service/tests/test_deb_canary_evidence.py"
      - "implementation/runtime_service/tests/test_deb_recovery_*.py"
      - "implementation/connectors/datto_rmm/component_execution.py"
      - "implementation/connectors/tests/test_deb_canary_variable_contract.py"
      - "implementation/connectors/tests/test_datto_rmm_component_execution.py"
      - ".github/workflows/deb-recovery-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-provider-and-json:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check 'pytest>=8.3,<9' jsonschema
      - name: Candidate and existing backup/authority regressions
        env:
          PYTHONPATH: .:implementation:implementation/runtime_service/src:implementation/cap-007/src:implementation/connectors/openclaw/src
        run: |
          python -m pytest -q \
            implementation/connectors/tests/test_deb_canary_variable_contract.py \
            implementation/connectors/tests/test_datto_rmm_component_execution.py \
            implementation/runtime_service/tests/test_deb_canary_evidence.py \
            implementation/runtime_service/tests/test_deb_recovery_verification.py \
            implementation/runtime_service/tests/test_deb_recovery_candidate.py \
            implementation/runtime_service/tests/test_json_backupiq_classifier.py \
            implementation/autonomous_remediation/test_deb_availability.py \
            implementation/autonomous_remediation/test_json_playbook_document.py \
            implementation/autonomous_remediation/test_json_playbook_store.py \
            implementation/connectors/tests/test_backup_net_connector.py \
            implementation/connectors/tests/test_backup_net_client.py \
            implementation/orchestrator/tests/test_backup_capability_catalog.py \
            implementation/kernel/tests/test_identity_authority.py \
            implementation/orchestrator/tests/test_approval_audit.py \
            implementation/orchestrator/tests/test_provider_read_authority.py \
            implementation/orchestrator/tests/test_provider_read_central_orchestrator.py \
            implementation/runtime_service/tests/test_datto_component_scope.py

  windows-powershell-51-mocked-contracts:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Require Windows PowerShell 5.1 and parse candidate files
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          foreach ($f in @('components/deb-recovery/RecoveryPrimitives.ps1','components/deb-recovery/NativeReadOnlyCanary.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw "Candidate parse failed: $f" }
          }
      - name: File behavior and mocked service/MSI contracts only
        shell: powershell
        run: ./components/deb-recovery/Test-RecoveryPrimitives.ps1
      - name: Preserve acceptance boundary
        shell: powershell
        run: Write-Output 'Mocked CI contracts do not prove endpoint MSI COM, service actions, original registration or integrated Jason execution.'
