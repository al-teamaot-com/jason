name: PMv4 A1 exact watchdog allowlist review
on:
  pull_request:
    paths:
      - "config/production-desired-state.json"
      - "tools/pmv4_a1_watchdog_policy_review.py"
      - "tools/pmv4_a1_watchdog_policy_readonly_local.sh"
      - "tests/test_pmv4_a1_watchdog_allowlist.py"
      - "tests/test_pmv4_a1_watchdog_policy_review.py"
      - ".github/workflows/pmv4-a1-watchdog-policy-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-policy-delta:
    name: Review one optional A1 container only (no root write)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One optional container, no guard weakening
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          PYTHONPATH=tools:. python -B -m pytest -q \
            tests/test_pmv4_a1_watchdog_allowlist.py \
            tests/test_pmv4_a1_watchdog_policy_review.py
          bash -n tools/pmv4_a1_watchdog_policy_readonly_local.sh
          python -B -m py_compile tools/pmv4_a1_watchdog_policy_review.py
          test ! -e /etc/jason/release-readback-recovery/production-desired-state.json
