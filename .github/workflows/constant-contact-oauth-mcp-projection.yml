name: Constant Contact isolated OAuth MCP projection
on:
  pull_request:
    paths:
      - 'tools/governed_provider_oauth_projection.py'
      - 'tools/tests/test_governed_provider_oauth_projection.py'
      - 'config/constant-contact-oauth-mcp-projection.json'
      - 'docs/operations/Constant-Contact-OAuth-MCP-Isolated-Activation-20261112.md'
      - '.github/workflows/constant-contact-oauth-mcp-projection.yml'
  push:
    paths:
      - 'tools/governed_provider_oauth_projection.py'
      - 'tools/tests/test_governed_provider_oauth_projection.py'
      - 'config/constant-contact-oauth-mcp-projection.json'
      - '.github/workflows/constant-contact-oauth-mcp-projection.yml'
permissions:
  contents: read
jobs:
  source-only-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8.3,<10'
      - name: Compile and test fail-closed credential projection
        run: |
          python -m py_compile tools/governed_provider_oauth_projection.py
          python -m pytest -q tools/tests/test_governed_provider_oauth_projection.py
      - name: Verify root profile pins reviewed script digest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          policy=json.loads(Path('config/constant-contact-oauth-mcp-projection.json').read_text())
          source=Path('tools/governed_provider_oauth_projection.py').read_bytes()
          assert policy['operation']=='constant-contact-oauth-mcp-approle-bind-v1'
          assert policy['one_shot'] is True
          assert policy['script_sha256']==hashlib.sha256(source).hexdigest()
          assert policy['mcp_image'].startswith('sha256:')
          assert policy['runtime_image'].startswith('sha256:')
          assert policy['unrelated_profiles']=='preserve_existing_disabled'
          print('EXACT_SOURCE_POLICY_SHA256=PASS')
          PY
