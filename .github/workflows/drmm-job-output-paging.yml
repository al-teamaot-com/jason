name: Validate Governed DRMM Output Paging

on:
  pull_request:
    paths:
      - 'implementation/mcp_service/src/jason_mcp/server.py'
      - 'implementation/mcp_service/tests/test_datto_job_output_paging.py'
      - '.github/workflows/drmm-job-output-paging.yml'
  push:
    paths:
      - 'implementation/mcp_service/src/jason_mcp/server.py'
      - 'implementation/mcp_service/tests/test_datto_job_output_paging.py'
      - '.github/workflows/drmm-job-output-paging.yml'

permissions:
  contents: read

jobs:
  drmm-job-output-paging:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/cap-001/src:implementation/cap-003/src:implementation/cap-007/src:implementation/connectors/openclaw/src:implementation/runtime_service/src:implementation/mcp_service/src
      JASON_DATTO_JOB_OUTPUT_PAGING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governed test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install ./implementation ./implementation/connectors/openclaw ./implementation/runtime_service ./implementation/mcp_service
      - name: Compile guarded output and tests
        run: |
          python -m py_compile implementation/mcp_service/src/jason_mcp/server.py implementation/mcp_service/tests/test_datto_job_output_paging.py
      - name: Verify bounded read pagination and authority regression
        run: |
          python -m pytest -q implementation/mcp_service/tests/test_datto_job_output_paging.py implementation/mcp_service/tests/test_governed_read_failure_contract.py implementation/mcp_service/tests/test_datto_component_approval_policy.py
