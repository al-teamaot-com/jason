name: Validate OpenClaw Ingress

on:
  push:
    paths:
      - "implementation/connectors/openclaw/**"
      - "implementation/orchestrator/gates.py"
      - "implementation/orchestrator/tests/test_gates.py"
      - ".github/workflows/openclaw-ingress.yml"
  pull_request:
    paths:
      - "implementation/connectors/openclaw/**"
      - "implementation/orchestrator/gates.py"
      - "implementation/orchestrator/tests/test_gates.py"
      - ".github/workflows/openclaw-ingress.yml"

permissions:
  contents: read

jobs:
  openclaw-ingress:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation/connectors/openclaw/src:implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install --upgrade pip pytest
      - name: Compile ingress and gates
        run: python -m compileall -q implementation/connectors/openclaw/src implementation/orchestrator/gates.py
      - name: Test OpenClaw connector and production ingress
        run: python -m pytest implementation/connectors/openclaw/tests -q
      - name: Test governance gate chain
        run: python -m pytest implementation/orchestrator/tests/test_gates.py -q
