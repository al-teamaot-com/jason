name: Validate Provider Read Runtime Credentials

on:
  pull_request:
    paths:
      - 'implementation/runtime_service/src/jason_runtime/provider_read_credentials.py'
      - 'implementation/runtime_service/tests/test_provider_read_credentials.py'
      - 'tools/stage_provider_read_runtime_credentials.py'
      - 'infrastructure/jason-runtime/compose.yaml'
      - 'infrastructure/jason-runtime/Dockerfile'
      - 'config/**'
      - '.dockerignore'
      - 'docs/sessions/IT-Glue-Autotask-Runtime-Credential-Staging-2026-09-10.md'
      - '.github/workflows/provider-read-runtime-credentials.yml'
  push:
    paths:
      - 'implementation/runtime_service/src/jason_runtime/provider_read_credentials.py'
      - 'implementation/runtime_service/tests/test_provider_read_credentials.py'
      - 'tools/stage_provider_read_runtime_credentials.py'
      - 'infrastructure/jason-runtime/compose.yaml'
      - 'infrastructure/jason-runtime/Dockerfile'
      - 'config/**'
      - '.dockerignore'
      - 'docs/sessions/IT-Glue-Autotask-Runtime-Credential-Staging-2026-09-10.md'
      - '.github/workflows/provider-read-runtime-credentials.yml'

jobs:
  provider-read-runtime-credentials:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation/runtime_service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile staging source
        run: |
          python -m py_compile \
            implementation/runtime_service/src/jason_runtime/provider_read_credentials.py \
            tools/stage_provider_read_runtime_credentials.py
      - name: Test staging safety contract
        run: |
          python -m pytest -q \
            implementation/runtime_service/tests/test_provider_read_credentials.py
      - name: Prove runtime Docker image builds from a clean checkout
        run: |
          test -d config
          grep -Fx '!config/' .dockerignore
          grep -Fx '!config/**' .dockerignore
          docker build \
            --file infrastructure/jason-runtime/Dockerfile \
            --tag jason-runtime:provider-read-ci \
            .
          echo 'JASON_RUNTIME_CLEAN_BUILD=PASS'
      - name: Prove Compose provider identities remain separate
        run: |
          grep -F '${JASON_IT_GLUE_OPENBAO_ROLE_ID_HOST_PATH:?set JASON_IT_GLUE_OPENBAO_ROLE_ID_HOST_PATH}:/run/jason-secrets/openbao/it-glue/role_id:ro' infrastructure/jason-runtime/compose.yaml
          grep -F '${JASON_IT_GLUE_OPENBAO_SECRET_ID_HOST_PATH:?set JASON_IT_GLUE_OPENBAO_SECRET_ID_HOST_PATH}:/run/jason-secrets/openbao/it-glue/secret_id:ro' infrastructure/jason-runtime/compose.yaml
          grep -F '${JASON_AUTOTASK_OPENBAO_ROLE_ID_HOST_PATH:?set JASON_AUTOTASK_OPENBAO_ROLE_ID_HOST_PATH}:/run/jason-secrets/openbao/autotask/role_id:ro' infrastructure/jason-runtime/compose.yaml
          grep -F '${JASON_AUTOTASK_OPENBAO_SECRET_ID_HOST_PATH:?set JASON_AUTOTASK_OPENBAO_SECRET_ID_HOST_PATH}:/run/jason-secrets/openbao/autotask/secret_id:ro' infrastructure/jason-runtime/compose.yaml
          echo 'PROVIDER_RUNTIME_IDENTITY_SEPARATION=PASS'
      - name: Prove check-only path has no staging or provider I/O
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tempfile

          from jason_runtime.provider_read_credentials import (
              build_provider_read_specs,
              preflight_provider_read_runtime_credentials,
          )

          with tempfile.TemporaryDirectory() as root:
              base = Path(root)
              specs = build_provider_read_specs(
                  bootstrap_root=base / 'bootstrap',
                  runtime_host_root=base / 'runtime',
              )
              for index, item in enumerate(specs, start=1):
                  item.source.parent.mkdir(parents=True, exist_ok=True)
                  item.source.write_text(f'opaque-ci-{index}\n', encoding='utf-8')
                  item.source.chmod(0o600)

              evidence = preflight_provider_read_runtime_credentials(
                  specs=specs,
                  expected_source_owner_uid=os.getuid(),
              )
              assert evidence['source_content_read'] is False
              assert evidence['destination_content_written'] is False
              assert evidence['provider_network_contacted'] is False
              assert evidence['openbao_contacted'] is False
              assert evidence['credential_values_printed'] is False
              assert evidence['source_files_changed'] is False
              assert not (base / 'runtime').exists()

          print('PROVIDER_RUNTIME_CREDENTIAL_PREFLIGHT=PASS')
          print('PROVIDER_NETWORK_IO=NO')
          print('OPENBAO_CONTACT=NO')
          print('CREDENTIAL_CONTENT_READ=NO')
          print('RUNTIME_CREDENTIAL_WRITE=NO')
          PY
