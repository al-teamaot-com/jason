name: Validate Jason

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cap-001:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/cap-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: implementation/cap-001/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate schemas
        run: python -c "from jason_cap_001.validation import load_schema; [load_schema(name) for name in ('investigation_request','case_package','reasoning_result','technician_response','recorded_outcome')]"
      - name: Test
        run: pytest

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install "mkdocs-material>=9.5,<10"
      - name: Assemble documentation
        run: python3 tools/assemble_docs.py
      - name: Build documentation
        run: mkdocs build --strict

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and generated Python files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type d -name __pycache__ -o -type f -name '*.pyc')"
          ! grep -RInE --exclude-dir=.git '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' .
