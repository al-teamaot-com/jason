name: Validate Jason

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cap-001:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/cap-001
    env:
      PYTHONPATH: ..
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: implementation/cap-001/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate schemas
        run: python -c "from jason_cap_001.validation import load_schema; [load_schema(name) for name in ('investigation_request','case_package','reasoning_result','technician_response','recorded_outcome')]"
      - name: Test
        run: pytest

  cap-003:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation/cap-003/src:implementation/cap-001/src:implementation/cli/src:implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile CAP-003 and shared runtime
        run: python -m compileall -q implementation/cap-003/src implementation/cap-003/tests implementation/orchestrator implementation/connectors implementation/kernel tools/autotask_business_context.py
      - name: Test CAP-003
        run: python -m pytest implementation/cap-003/tests -q
      - name: Test convergence release gates
        run: python -m pytest implementation/release/tests/test_cap003_convergence.py -q

  resource-convergence:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/connectors/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile connector convergence
        run: python -m compileall -q implementation/connectors tools/resource_convergence_preflight.py
      - name: Test resource convergence contracts
        run: |
          python -m pytest \
            implementation/connectors/tests/test_resource_gateway.py \
            implementation/connectors/tests/test_provider_resource_adapters.py \
            implementation/connectors/tests/test_relationships.py \
            implementation/connectors/tests/test_artifact_evidence.py \
            implementation/connectors/tests/test_resource_convergence.py \
            -q
      - name: Verify credential-safe preflight
        run: |
          python tools/resource_convergence_preflight.py > /tmp/resource-convergence-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/resource-convergence-preflight.json').read_text())
          assert report['status'] == 'credential_boundary_reached'
          assert report['network_contacted'] is False
          assert report['secret_resolved'] is False
          assert report['required_logical_secrets']['it_glue']['logical_name'] == 'it_glue.readonly'
          assert report['required_logical_secrets']['datto_rmm']['logical_name'] == 'datto_rmm.readonly'
          PY

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install "mkdocs-material>=9.5,<10"
      - name: Assemble documentation
        run: python3 tools/assemble_docs.py
      - name: Build documentation
        run: mkdocs build --strict

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and generated Python files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type d -name __pycache__ -o -type f -name '*.pyc')"
          ! grep -RInE --exclude-dir=.git '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' .
