name: Validate Jason

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cap-001:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/cap-001
    env:
      PYTHONPATH: ..
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: implementation/cap-001/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate schemas
        run: python -c "from jason_cap_001.validation import load_schema; [load_schema(name) for name in ('investigation_request','case_package','reasoning_result','technician_response','recorded_outcome')]"
      - name: Test
        run: pytest

  cap-003:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation/cap-003/src:implementation/cap-001/src:implementation/cli/src:implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile CAP-003 and shared runtime
        run: python -m compileall -q implementation/cap-003/src implementation/cap-003/tests implementation/orchestrator implementation/connectors implementation/kernel tools/autotask_business_context.py
      - name: Test CAP-003
        run: python -m pytest implementation/cap-003/tests -q
      - name: Test convergence release gates
        run: python -m pytest implementation/release/tests/test_cap003_convergence.py -q

  cap-007:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation/cap-007/src:implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile governed email slice
        run: python -m compileall -q implementation/cap-007/src implementation/cap-007/tests implementation/orchestrator implementation/kernel
      - name: Test email safety and Kernel registration
        run: python -m pytest implementation/cap-007/tests -q
      - name: Reject workflow-specific send scripts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -iname 'send_ticket_email.py' -o -iname 'send_invoice_email.py' -o -iname 'send_alert_email.py' -o -iname 'send_client_update.py' -o -iname '*ses*provision*.py' -o -iname '*sendmail*provision*.py' \))"

  system-registry:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install registry test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Compile System Registry
        run: python -m compileall -q implementation/kernel/system_registry implementation/kernel/tests/test_system_registry.py implementation/kernel/tests/test_system_registry_production.py implementation/kernel/tests/test_system_registry_lifecycle_events.py implementation/orchestrator/system_registry_resource.py implementation/orchestrator/resource_evidence.py implementation/orchestrator/tests/test_system_registry_resource.py implementation/orchestrator/tests/test_system_registry_resource_response.py tools/system_registry_verify.py tools/system_registry_docs.py
      - name: Validate System Registry schemas and production state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          registry_dir = Path("implementation/kernel/system_registry")
          manifest_schema = json.loads((registry_dir / "system-registry.schema.json").read_text())
          lifecycle_schema = json.loads((registry_dir / "system-registry-lifecycle-events.schema.json").read_text())
          manifest = json.loads((registry_dir / "production-registry.json").read_text())
          lifecycle = json.loads((registry_dir / "production-lifecycle-events.json").read_text())
          Draft202012Validator.check_schema(manifest_schema)
          Draft202012Validator.check_schema(lifecycle_schema)
          Draft202012Validator(manifest_schema).validate(manifest)
          Draft202012Validator(lifecycle_schema).validate(lifecycle)
          PY
      - name: Validate production topology and bounded observation plan
        run: python tools/system_registry_verify.py --validate-only
      - name: Verify generated operational-state documentation
        run: python tools/system_registry_docs.py --check
      - name: Test constitutional System Registry behavior and governed query surface
        run: python -m pytest implementation/kernel/tests/test_system_registry.py implementation/kernel/tests/test_system_registry_production.py implementation/kernel/tests/test_system_registry_lifecycle_events.py implementation/orchestrator/tests/test_system_registry_resource.py implementation/orchestrator/tests/test_system_registry_resource_response.py -q

  runtime-service:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: implementation:implementation/cap-007/src:implementation/connectors/openclaw/src:implementation/runtime_service/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install ./implementation ./implementation/connectors/openclaw ./implementation/runtime_service
      - name: Compile runtime composition
        run: python -m compileall -q implementation/runtime_service/src implementation/runtime_service/tests
      - name: Test governed runtime composition
        run: python -m pytest implementation/runtime_service/tests -q

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation tools
        run: python -m pip install "mkdocs-material>=9.5,<10"
      - name: Validate documentation control plane
        run: python3 tools/validate_documentation_control.py
      - name: Assemble documentation
        run: python3 tools/assemble_docs.py
      - name: Build documentation
        run: mkdocs build --strict

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and generated Python files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type d -name __pycache__ -o -type f -name '*.pyc')"
          ! grep -RInE --exclude-dir=.git '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' .
