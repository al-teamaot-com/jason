name: Governed real SQLite proof recovery root one-shot
on:
  pull_request:
    paths:
      - 'tools/owner_full_integrity_recovery.py'
      - 'tools/tests/test_owner_full_integrity_recovery.py'
      - 'config/full-integrity-recovery-policy.json'
      - 'docs/operations/Governed-Full-Integrity-One-Shot-Root-Recovery-20261112.md'
      - '.github/workflows/owner-full-integrity-recovery.yml'
  push:
    paths:
      - 'tools/owner_full_integrity_recovery.py'
      - 'tools/tests/test_owner_full_integrity_recovery.py'
      - 'config/full-integrity-recovery-policy.json'
      - '.github/workflows/owner-full-integrity-recovery.yml'
permissions:
  contents: read
jobs:
  fail-closed-source-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8.3,<10'
      - name: Synthetic safety and exact-PASS evidence tests
        run: |
          python -m py_compile tools/owner_full_integrity_recovery.py
          python -m pytest -q tools/tests/test_owner_full_integrity_recovery.py tools/tests/test_openclaw_authority_health_snapshot.py tools/tests/test_openclaw_authority_operational_health.py tools/tests/test_openclaw_authority_fast_health.py
      - name: Verify exact file-hash and duration policy
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('config/full-integrity-recovery-policy.json').read_text())
          for field,path in [
              ('source_script_sha256','tools/owner_full_integrity_recovery.py'),
              ('snapshot_sha256','tools/openclaw_authority_health_snapshot.py'),
              ('checker_sha256','tools/openclaw_authority_operational_health.py'),
          ]:
              assert r[field]==hashlib.sha256(Path(path).read_bytes()).hexdigest(),field
          assert r['one_shot'] is True
          assert r['exact_action']=='owner-full-sqlite-integrity-proof-90m-recovery-v1'
          assert r['scan_timeout_seconds']==5400
          assert r['supervisor_timeout_seconds']==5700
          assert r['lkg_sha']=='d1b8c196dadd4b672ec8ba47075f27bb61c98d63'
          assert r['trusted_owner_auth_sha256']=='24d3632a4b0aa60851a1c82ccb15539eb823dd26afa5a1a2cc8c7afc54d72153'
          print('ROOT_EXACT_SOURCE_POLICY_HASH=PASS')
          PY
