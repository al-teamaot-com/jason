name: Validate OpenClaw Operations

on:
  push:
    paths:
      - "tools/catch_me_up.py"
      - "tools/delegation_maintenance.py"
      - "tools/openclaw_authority_operational_health.py"
      - "tools/openclaw_authority_health_snapshot.py"
      - "tools/install_openclaw_authority_operations.sh"
      - "infrastructure/openclaw-operations/**"
      - "infrastructure/showcase/status_exporter.py"
      - "infrastructure/showcase/systemd/jason-status-exporter.service"
      - "infrastructure/showcase/tests/test_status_exporter.py"
      - ".github/workflows/openclaw-operations.yml"
  pull_request:
    paths:
      - "tools/catch_me_up.py"
      - "tools/delegation_maintenance.py"
      - "tools/openclaw_authority_operational_health.py"
      - "tools/openclaw_authority_health_snapshot.py"
      - "tools/install_openclaw_authority_operations.sh"
      - "infrastructure/openclaw-operations/**"
      - "infrastructure/showcase/status_exporter.py"
      - "infrastructure/showcase/systemd/jason-status-exporter.service"
      - "infrastructure/showcase/tests/test_status_exporter.py"
      - ".github/workflows/openclaw-operations.yml"

permissions:
  contents: read

jobs:
  openclaw-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tests
        run: python -m pip install --upgrade pip pytest
      - name: Compile operational tooling
        run: |
          python -m compileall -q \
            tools/catch_me_up.py \
            tools/delegation_maintenance.py \
            tools/openclaw_authority_operational_health.py \
            tools/openclaw_authority_health_snapshot.py \
            infrastructure/showcase/status_exporter.py \
            infrastructure/showcase/tests
      - name: Validate shell packaging
        run: bash -n tools/install_openclaw_authority_operations.sh
      - name: Validate systemd unit syntax
        run: systemd-analyze verify infrastructure/openclaw-operations/systemd/*.service infrastructure/openclaw-operations/systemd/*.timer infrastructure/showcase/systemd/jason-status-exporter.service
      - name: Test Command Center operational metrics
        run: python -m pytest infrastructure/showcase/tests/test_status_exporter.py -q
      - name: Verify CatchMeUp renders without protected state
        run: python tools/catch_me_up.py --stdout-only > /tmp/catchmeup.md
