name: PMv4 Ticket Core Cutover Read-only Gate
on:
  pull_request:
    paths:
      - "tools/pmv4_ticket_core_cutover_preflight.py"
      - "tests/test_pmv4_ticket_core_cutover_preflight.py"
      - "tools/pmv4_ticket_core_exact_projection.py"
      - "tools/pmv4_c_sqlite_family_handoff.py"
      - "tests/test_pmv4_c_sqlite_family_handoff.py"
      - "tools/pmv4_c_service_manifest.py"
      - "tests/test_pmv4_c_service_manifest.py"
      - "tools/pmv4_c_atomic_root.py"
      - "tools/pmv4_c_atomic_owner.py"
      - "tools/pmv4_c_immutable_builder.py"
      - "tests/test_pmv4_c_atomic_root.py"
      - "tests/test_pmv4_c_immutable_builder.py"
      - "infrastructure/pmv4-ticket-core/Dockerfile"
      - "implementation/runtime_service/src/jason_runtime/ticket_worker_health.py"
      - "implementation/runtime_service/src/jason_runtime/composition.py"
      - "implementation/runtime_service/tests/test_ticket_worker_health.py"
      - "tests/test_pmv4_ticket_core_exact_projection.py"
      - "implementation/runtime_service/src/jason_runtime/maintenance_process.py"
      - "implementation/runtime_service/tests/test_ticket_core_worker_only_composition.py"
      - ".github/workflows/pmv4-ticket-core-cutover-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cutover-baseline-no-production:
    name: Stage C exact data and lock safety (no cutover)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source-only evidence and fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          PYTHONPATH=implementation:implementation/runtime_service/src:. python -B -m pytest -q \
            tests/test_pmv4_ticket_core_cutover_preflight.py \
            tests/test_pmv4_ticket_core_ledger_snapshot.py \
            tests/test_pmv4_ticket_core_exact_projection.py \
            tests/test_pmv4_c_sqlite_family_handoff.py \
            tests/test_pmv4_c_service_manifest.py \
            tests/test_pmv4_c_atomic_root.py \
            tests/test_pmv4_c_immutable_builder.py \
            implementation/runtime_service/tests/test_ticket_worker_health.py \
            implementation/runtime_service/tests/test_ticket_core_worker_only_composition.py \
            implementation/runtime_service/tests/test_ticket_core_lifecycle.py
          test ! -e /var/lib/jason/openclaw/autonomy-operational-work.sqlite3
          test ! -e /var/lib/jason/ticket-core/autonomy-operational-work.sqlite3
