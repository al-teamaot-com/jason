name: PMv4 Stage E Provider-Free Canary Exact Owner Root Source
on:
  pull_request:
    paths:
      - "tools/pmv4_e_canary_oneowner_root.py"
      - "tools/pmv4_e_canary_oneowner_owner.py"
      - "tools/pmv4_e_canary_oneowner_local.sh"
      - "tools/pmv4_e_canary_oneowner_builder.py"
      - "tools/pmv4_e_canary_host.py"
      - "tools/tests/test_pmv4_e_canary_oneowner_root.py"
      - "tools/tests/test_pmv4_e_canary_oneowner_builder.py"
      - ".github/workflows/pmv4-e-canary-oneowner-root.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-one-owner-canary-and-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test immutable source, authenticated Owner proof and native rollback
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest cryptography PyYAML
          PYTHONPATH=.:implementation:implementation/mcp_service/src python -B -m pytest -q \
            tools/tests/test_pmv4_e_canary_oneowner_builder.py \
            tools/tests/test_pmv4_e_canary_oneowner_root.py \
            tools/tests/test_pmv4_e_canary_host.py \
            tools/tests/test_pmv4_e_canary_release_root.py \
            tools/tests/test_pmv4_e_providerfree_canary.py \
            tools/tests/test_pmv4_e_canary_packet.py \
            tests/test_pmv4_e_canary_drift_policy.py \
            tests/test_pmv4_e_scheduler_parity.py \
            tools/tests/test_independent_component_release.py \
            tools/tests/test_independent_component_host_adapter.py \
            tests/test_pmv4_e_retirement_readiness.py \
            tests/test_pmv4_e_root_receipt_readback.py
          python -B -m py_compile \
            tools/pmv4_e_canary_oneowner_root.py \
            tools/pmv4_e_canary_oneowner_owner.py \
            tools/pmv4_e_canary_oneowner_builder.py \
            tools/pmv4_e_canary_host.py
          bash -n tools/pmv4_e_canary_oneowner_local.sh
          test ! -e /var/lib/jason/independent-component-release
          test ! -e /etc/jason/release-readback-recovery/production-desired-state.json
