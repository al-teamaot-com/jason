name: PMv4 E Provider-Free Canary & Scheduling Source Only
on:
  pull_request:
    paths:
      - "infrastructure/pmv4-e-canary/**"
      - "tools/pmv4_e_canary_contract.py"
      - "tools/pmv4_e_canary_host.py"
      - "tools/pmv4_e_canary_drift_policy.py"
      - "tests/test_pmv4_e_canary_drift_policy.py"
      - "tools/tests/test_pmv4_e_canary_host.py"
      - "tools/pmv4_e_canary_release_root.py"
      - "tools/tests/test_pmv4_e_canary_release_root.py"
      - "tools/pmv4_e_canary_packet.py"
      - "tools/pmv4_e_scheduler_parity.py"
      - "tools/jason_self_heal_watchdog.py"
      - "tools/tests/test_pmv4_e_watchdog_retarget.py"
      - "tools/pmv4_e_unit_admission.py"
      - "tools/pmv4_e_root_reconcile_admission.py"
      - "tools/release_manager_host_runner.py"
      - "tools/tests/test_pmv4_e_release_manager_convergence.py"
      - "tools/reconcile_production_host_services.sh"
      - "tools/pmv4_e_retirement_readiness.py"
      - "tests/test_pmv4_e_root_reconcile_admission.py"
      - "tools/pmv4_e_replacement_unit_bundle.py"
      - "tools/pmv4_e_engineering_manager_relocation.py"
      - "tools/pmv4_e_engineering_manager_guard.py"
      - "tools/pmv4_e_engineering_manager_transaction.py"
      - "tools/pmv4_e_engineering_manager_install.py"
      - "tests/test_pmv4_e_engineering_manager_install.py"
      - "tests/test_pmv4_e_engineering_manager_transaction.py"
      - "tools/pmv4_e_engineering_manager_client.py"
      - "tests/test_pmv4_e_engineering_manager_guard.py"
      - "tests/test_pmv4_e_engineering_manager_relocation.py"
      - "infrastructure/pmv4-e-engineering-manager/**"
      - "tools/pmv4_e_six_unit_transaction_model.py"
      - "tools/pmv4_e_root_cutover_preflight.py"
      - "tools/pmv4_e_ticket_owner_readback.py"
      - "tools/tests/test_pmv4_e_ticket_owner_readback.py"
      - "tools/tests/test_pmv4_e_root_cutover_preflight.py"
      - "tools/tests/test_pmv4_e_six_unit_transaction_model.py"
      - "tools/tests/test_pmv4_e_native_six_unit_release.py"
      - "tools/pmv4_e_native_systemd_adapter.py"
      - "tools/tests/test_pmv4_e_native_systemd_adapter.py"
      - "tools/pmv4_e_systemd_root_ops.py"
      - "tools/tests/test_pmv4_e_systemd_root_ops.py"
      - "tools/pmv4_e_native_backend_bridge.py"
      - "tools/tests/test_pmv4_e_native_backend_bridge.py"
      - "tools/pmv4_e_exact_release_packet.py"
      - "tools/tests/test_pmv4_e_exact_release_packet.py"
      - "tools/pmv4_e_root_trust_stage.py"
      - "tools/tests/test_pmv4_e_root_trust_stage.py"
      - "infrastructure/pmv4-e-scheduler/**"
      - "tests/test_pmv4_e_unit_admission.py"
      - "tests/test_pmv4_e_replacement_unit_bundle.py"
      - "tools/tests/test_pmv4_e_providerfree_canary.py"
      - "tools/tests/test_pmv4_e_canary_packet.py"
      - "tests/test_pmv4_e_scheduler_parity.py"
      - ".github/workflows/pmv4-e-providerfree-scheduler-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  providerfree-controller-and-durable-schedule:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline signed controller, provider-free image and scheduler tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest cryptography PyYAML
          PYTHONPATH=tools:.:implementation:implementation/mcp_service/src python -B -m pytest -q \
            tools/tests/test_pmv4_e_providerfree_canary.py \
            tools/tests/test_pmv4_e_canary_host.py \
            tests/test_pmv4_e_canary_drift_policy.py \
            tools/tests/test_pmv4_e_canary_release_root.py \
            tools/tests/test_pmv4_e_canary_packet.py \
            tests/test_pmv4_e_scheduler_parity.py \
            tools/tests/test_pmv4_e_watchdog_retarget.py \
            tools/tests/test_jason_self_heal_watchdog.py \
            tests/test_pmv4_e_unit_admission.py \
            tests/test_pmv4_e_root_reconcile_admission.py \
            tools/tests/test_pmv4_e_release_manager_convergence.py \
            tools/tests/test_pmv4_e_six_unit_transaction_model.py \
            tools/tests/test_pmv4_e_native_six_unit_release.py \
            tools/tests/test_pmv4_e_native_systemd_adapter.py \
            tools/tests/test_pmv4_e_systemd_root_ops.py \
            tools/tests/test_pmv4_e_native_backend_bridge.py \
            tools/tests/test_pmv4_e_exact_release_packet.py \
            tools/tests/test_pmv4_e_root_trust_stage.py \
            tools/tests/test_pmv4_e_root_cutover_preflight.py \
            tools/tests/test_pmv4_e_ticket_owner_readback.py \
            tools/tests/test_reconcile_production_host_services.py \
            tests/test_pmv4_e_replacement_unit_bundle.py \
            tests/test_pmv4_e_engineering_manager_relocation.py \
            tests/test_pmv4_e_engineering_manager_guard.py \
            tests/test_pmv4_e_engineering_manager_transaction.py \
            tests/test_pmv4_e_engineering_manager_install.py \
            tools/tests/test_independent_component_release.py \
            tools/tests/test_independent_component_host_adapter.py \
            tools/tests/test_independent_component_release_bundle.py \
            tools/tests/test_independent_component_control_install_root.py \
            implementation/mcp_service/tests/test_independent_component_release_approval.py \
            tests/test_pmv4_e_retirement_readiness.py \
            tests/test_pmv4_e_root_receipt_readback.py
          python -B -m py_compile \
            tools/pmv4_e_canary_contract.py \
            tools/pmv4_e_canary_host.py \
            tools/pmv4_e_canary_drift_policy.py \
            tools/pmv4_e_canary_release_root.py \
            tools/pmv4_e_canary_packet.py \
            tools/pmv4_e_scheduler_parity.py \
            tools/jason_self_heal_watchdog.py \
            tools/pmv4_e_unit_admission.py \
            tools/pmv4_e_root_reconcile_admission.py \
            tools/release_manager_host_runner.py \
            tools/pmv4_e_six_unit_transaction_model.py \
            tools/pmv4_e_root_cutover_preflight.py \
            tools/pmv4_e_ticket_owner_readback.py \
            tools/pmv4_e_replacement_unit_bundle.py
          bash -n tools/reconcile_production_host_services.sh
          test ! -e /var/lib/jason/independent-component-release
          test ! -e /etc/jason/release-readback-recovery/production-desired-state.json
      - name: Compose parse only, never activate
        shell: bash
        run: |
          set -euo pipefail
          export JASON_PMV4_E_CONFIG=/var/lib/jason/independent-component-release/releases/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/config.json
          export JASON_PMV4_E_SOURCE=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose -f infrastructure/pmv4-e-canary/compose.yaml config --format json > "$RUNNER_TEMP/pmv4-e-canary-config.json"
          PYTHONPATH=. python -B - "$RUNNER_TEMP/pmv4-e-canary-config.json" <<'PY'
          import json,sys
          from tools import pmv4_e_canary_contract as contract
          with open(sys.argv[1],encoding="utf-8") as f:
              resolved=json.load(f)
          try:
              contract.validate_resolved_compose(resolved,candidate_sha="a"*40)
          except Exception:
              # This fixture contains only fixed nonsecret source fields.
              # Show exact Compose serialization to diagnose v2/v5 differences.
              print("PMV4_E_SOURCE_ONLY_CONFIG="+json.dumps(
                  resolved,sort_keys=True,separators=(",",":")))
              raise
          print("PMV4_E_CANARY_DOCKER_COMPOSE_READONLY=PASS")
          PY
