name: Validate Datto RMM Live Read Foundation

on:
  pull_request:
    paths:
      - 'implementation/connectors/datto_rmm/**'
      - 'implementation/connectors/provider_resource_adapters.py'
      - 'implementation/connectors/tests/test_datto_rmm_auth.py'
      - 'implementation/connectors/tests/test_datto_rmm_connector.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_reads.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_manifest.py'
      - 'implementation/connectors/tests/test_provider_resource_adapters.py'
      - 'implementation/orchestrator/capability_routing_invoker.py'
      - 'implementation/orchestrator/resource_capability_catalog.py'
      - 'implementation/orchestrator/tests/test_capability_routing_invoker.py'
      - 'implementation/orchestrator/tests/test_resource_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/tests/test_datto_automation_runtime.py'
      - 'tools/datto_rmm_live_read.py'
      - '.github/workflows/datto-rmm-live-read.yml'
  push:
    paths:
      - 'implementation/connectors/datto_rmm/**'
      - 'implementation/connectors/provider_resource_adapters.py'
      - 'implementation/connectors/tests/test_datto_rmm_auth.py'
      - 'implementation/connectors/tests/test_datto_rmm_connector.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_reads.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_manifest.py'
      - 'implementation/connectors/tests/test_provider_resource_adapters.py'
      - 'implementation/orchestrator/capability_routing_invoker.py'
      - 'implementation/orchestrator/resource_capability_catalog.py'
      - 'implementation/orchestrator/tests/test_capability_routing_invoker.py'
      - 'implementation/orchestrator/tests/test_resource_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/tests/test_datto_automation_runtime.py'
      - 'tools/datto_rmm_live_read.py'
      - '.github/workflows/datto-rmm-live-read.yml'

jobs:
  validate-datto-rmm-live-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile DRMM read boundary
        run: |
          python -m py_compile implementation/connectors/datto_rmm/auth.py
          python -m py_compile implementation/connectors/datto_rmm/connector.py
          python -m py_compile implementation/connectors/datto_rmm/automation_reads.py
          python -m py_compile implementation/connectors/datto_rmm/automation_manifest.py
          python -m py_compile implementation/connectors/datto_rmm/capability_manifest.py
          python -m py_compile implementation/orchestrator/capability_routing_invoker.py
          python -m py_compile implementation/orchestrator/resource_capability_catalog.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/provider_reads.py
          python -m py_compile tools/datto_rmm_live_read.py
      - name: Run DRMM auth and resource translation tests
        env:
          PYTHONPATH: implementation:implementation/runtime_service/src:implementation/cap-007/src:implementation/connectors/openclaw/src
        run: |
          python -m pytest implementation/connectors/tests/test_datto_rmm_auth.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_connector.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_automation_reads.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_automation_manifest.py -q
          python -m pytest implementation/connectors/tests/test_provider_resource_adapters.py -q
          python -m pytest implementation/orchestrator/tests/test_capability_routing_invoker.py -q
          python -m pytest implementation/orchestrator/tests/test_resource_capability_catalog.py -q
          python -m pytest implementation/runtime_service/tests/test_datto_automation_runtime.py -q
      - name: Verify credential-safe live-read preflight
        run: |
          python tools/datto_rmm_live_read.py > /tmp/drmm-live-preflight.json
          python - <<'PY'
          import json
          with open('/tmp/drmm-live-preflight.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'credential_safe_preflight'
          assert result['network_contacted'] is False
          assert result['provider_credentials_used'] is False
          assert result['maximum_records'] == 2
          assert result['ambiguity_detection_enabled'] is True
          assert result['capability'] == 'datto_rmm.device.search'
          PY
