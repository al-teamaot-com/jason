name: Validate Datto RMM Automation Foundation

on:
  pull_request:
    paths:
      - 'implementation/connectors/datto_rmm/**'
      - 'implementation/connectors/provider_resource_adapters.py'
      - 'implementation/connectors/tests/test_datto_rmm_auth.py'
      - 'implementation/connectors/tests/test_datto_rmm_connector.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_reads.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_manifest.py'
      - 'implementation/connectors/tests/test_datto_rmm_component_execution.py'
      - 'implementation/connectors/tests/test_datto_rmm_execution_identity.py'
      - 'implementation/connectors/tests/test_provider_resource_adapters.py'
      - 'implementation/orchestrator/capability_routing_invoker.py'
      - 'implementation/orchestrator/resource_capability_catalog.py'
      - 'implementation/orchestrator/tests/test_capability_routing_invoker.py'
      - 'implementation/orchestrator/tests/test_resource_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/tests/test_datto_automation_runtime.py'
      - 'deploy/openbao/config/jason-datto-rmm-execution-policy.hcl'
      - 'deploy/openbao/scripts/provision-datto-rmm-execution.py'
      - 'deploy/openbao/scripts/recover-datto-rmm-execution-staging.py'
      - 'deploy/openbao/scripts/recover-datto-rmm-execution-staging-live-shape.py'
      - 'deploy/openbao/scripts/adjust-datto-rmm-execution-token-uses.py'
      - 'deploy/openbao/tests/test_recover_datto_rmm_execution_staging.py'
      - 'deploy/openbao/tests/test_recover_datto_rmm_execution_live_shape.py'
      - 'deploy/openbao/tests/test_adjust_datto_rmm_execution_token_uses.py'
      - 'tools/datto_rmm_live_read.py'
      - 'tools/datto_rmm_execution_identity_probe.py'
      - 'tools/tests/test_datto_rmm_execution_identity_probe.py'
      - '.github/workflows/datto-rmm-live-read.yml'
  push:
    paths:
      - 'implementation/connectors/datto_rmm/**'
      - 'implementation/connectors/provider_resource_adapters.py'
      - 'implementation/connectors/tests/test_datto_rmm_auth.py'
      - 'implementation/connectors/tests/test_datto_rmm_connector.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_reads.py'
      - 'implementation/connectors/tests/test_datto_rmm_automation_manifest.py'
      - 'implementation/connectors/tests/test_datto_rmm_component_execution.py'
      - 'implementation/connectors/tests/test_datto_rmm_execution_identity.py'
      - 'implementation/connectors/tests/test_provider_resource_adapters.py'
      - 'implementation/orchestrator/capability_routing_invoker.py'
      - 'implementation/orchestrator/resource_capability_catalog.py'
      - 'implementation/orchestrator/tests/test_capability_routing_invoker.py'
      - 'implementation/orchestrator/tests/test_resource_capability_catalog.py'
      - 'implementation/runtime_service/src/jason_runtime/provider_reads.py'
      - 'implementation/runtime_service/tests/test_datto_automation_runtime.py'
      - 'deploy/openbao/config/jason-datto-rmm-execution-policy.hcl'
      - 'deploy/openbao/scripts/provision-datto-rmm-execution.py'
      - 'deploy/openbao/scripts/recover-datto-rmm-execution-staging.py'
      - 'deploy/openbao/scripts/recover-datto-rmm-execution-staging-live-shape.py'
      - 'deploy/openbao/scripts/adjust-datto-rmm-execution-token-uses.py'
      - 'deploy/openbao/tests/test_recover_datto_rmm_execution_staging.py'
      - 'deploy/openbao/tests/test_recover_datto_rmm_execution_live_shape.py'
      - 'deploy/openbao/tests/test_adjust_datto_rmm_execution_token_uses.py'
      - 'tools/datto_rmm_live_read.py'
      - 'tools/datto_rmm_execution_identity_probe.py'
      - 'tools/tests/test_datto_rmm_execution_identity_probe.py'
      - '.github/workflows/datto-rmm-live-read.yml'

jobs:
  validate-datto-rmm-automation-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile DRMM automation boundary
        run: |
          python -m py_compile implementation/connectors/datto_rmm/auth.py
          python -m py_compile implementation/connectors/datto_rmm/connector.py
          python -m py_compile implementation/connectors/datto_rmm/automation_reads.py
          python -m py_compile implementation/connectors/datto_rmm/automation_manifest.py
          python -m py_compile implementation/connectors/datto_rmm/capability_manifest.py
          python -m py_compile implementation/connectors/datto_rmm/component_execution.py
          python -m py_compile implementation/connectors/datto_rmm/execution_identity.py
          python -m py_compile implementation/connectors/datto_rmm/mutations.py
          python -m py_compile implementation/orchestrator/capability_routing_invoker.py
          python -m py_compile implementation/orchestrator/resource_capability_catalog.py
          python -m py_compile implementation/runtime_service/src/jason_runtime/provider_reads.py
          python -m py_compile deploy/openbao/scripts/provision-datto-rmm-execution.py
          python -m py_compile deploy/openbao/scripts/recover-datto-rmm-execution-staging.py
          python -m py_compile deploy/openbao/scripts/recover-datto-rmm-execution-staging-live-shape.py
          python -m py_compile deploy/openbao/scripts/adjust-datto-rmm-execution-token-uses.py
          python -m py_compile tools/datto_rmm_live_read.py
          python -m py_compile tools/datto_rmm_execution_identity_probe.py
      - name: Run DRMM read and proposal-boundary tests
        env:
          PYTHONPATH: implementation:implementation/runtime_service/src:implementation/cap-007/src:implementation/connectors/openclaw/src
        run: |
          python -m pytest implementation/connectors/tests/test_datto_rmm_auth.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_connector.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_automation_reads.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_automation_manifest.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_component_execution.py -q
          python -m pytest implementation/connectors/tests/test_datto_rmm_execution_identity.py -q
          python -m pytest implementation/connectors/tests/test_provider_resource_adapters.py -q
          python -m pytest implementation/orchestrator/tests/test_capability_routing_invoker.py -q
          python -m pytest implementation/orchestrator/tests/test_resource_capability_catalog.py -q
          python -m pytest implementation/runtime_service/tests/test_datto_automation_runtime.py -q
          python -m pytest deploy/openbao/tests/test_recover_datto_rmm_execution_staging.py -q
          python -m pytest deploy/openbao/tests/test_recover_datto_rmm_execution_live_shape.py -q
          python -m pytest deploy/openbao/tests/test_adjust_datto_rmm_execution_token_uses.py -q
          python -m pytest tools/tests/test_datto_rmm_execution_identity_probe.py -q
      - name: Verify credential-safe live-read preflights
        run: |
          python tools/datto_rmm_live_read.py > /tmp/drmm-live-preflight.json
          python tools/datto_rmm_execution_identity_probe.py > /tmp/drmm-execution-probe-preflight.json
          python - <<'PY'
          import json
          with open('/tmp/drmm-live-preflight.json', encoding='utf-8') as handle:
              result = json.load(handle)
          assert result['status'] == 'credential_safe_preflight'
          assert result['network_contacted'] is False
          assert result['provider_credentials_used'] is False
          assert result['maximum_records'] == 2
          assert result['ambiguity_detection_enabled'] is True
          assert result['capability'] == 'datto_rmm.device.search'
          with open('/tmp/drmm-execution-probe-preflight.json', encoding='utf-8') as handle:
              probe = json.load(handle)
          assert probe['status'] == 'credential_safe_preflight'
          assert probe['network_contacted'] is False
          assert probe['provider_credentials_used'] is False
          assert probe['provider_mutation_requests'] == 0
          assert probe['component_execution_attempted'] is False
          assert probe['runtime_execution_activated'] is False
          PY
